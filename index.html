<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>2AM</title>
<link rel="icon" type="image/png" href="/IMG_0824.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--dim:rgba(255,255,255,.55);--dim2:rgba(255,255,255,.32);--hover:rgba(255,255,255,.06);--glass-bg:rgba(255,255,255,.05);--glass-border:rgba(255,255,255,.09);--sa-top:env(safe-area-inset-top,0px);--sa-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;overflow:hidden;background:#000}
body{color:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 90% 60% at 50% -15%,rgba(255,255,255,.07),transparent 70%)}
.app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column}

.header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--sa-top)) 22px 10px;flex-shrink:0;gap:10px}
.logo{height:52px;width:auto;max-width:200px;display:block;object-fit:contain;filter:brightness(1.1);transition:transform .3s}
.logo:hover{transform:scale(1.04)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}

.tabs{display:flex;gap:6px;padding:0 22px 12px;flex-shrink:0}
.tab{padding:10px 22px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--dim);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.tab:hover{color:#fff;background:var(--glass-bg);border-color:var(--glass-border)}
.tab.active{background:rgba(255,255,255,.95);color:#000;box-shadow:0 8px 24px rgba(255,255,255,.08)}

.content{flex:1;overflow-y:auto;padding:0 22px 220px;min-height:0;position:relative;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:14px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-title:first-child{margin-top:4px}
.add-playlist-btn{width:34px;height:34px;border-radius:50%;background:var(--glass-bg);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;border:1px solid var(--glass-border)}
.add-playlist-btn:hover{background:rgba(255,255,255,.14);transform:rotate(90deg)}
.add-playlist-btn svg{width:16px;height:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;margin-bottom:12px;animation:fadeUp .4s cubic-bezier(.2,.9,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{cursor:pointer;transition:.25s cubic-bezier(.2,.9,.3,1);position:relative}
.card:hover{transform:translateY(-3px)}
.card-art{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:rgba(255,255,255,.2);overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.card-art img{width:100%;height:100%;object-fit:cover;transition:transform .4s cubic-bezier(.2,.9,.3,1)}
.card:hover .card-art img{transform:scale(1.06)}
.card-glow{position:absolute;inset:-8px;border-radius:18px;background:var(--card-color,rgba(255,255,255,.1));filter:blur(22px);opacity:0;z-index:-1;transition:.4s}
.card:hover .card-glow{opacity:.4}
.card-title{font-size:14px;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12.5px;color:var(--dim2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-play{position:absolute;bottom:8px;right:8px;width:42px;height:42px;border-radius:50%;background:#fff;color:#000;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.25s;transform:translateY(8px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card:hover .card-play{opacity:1;transform:translateY(0)}
.card-play:hover{transform:scale(1.1)}
.card-play svg{width:16px;height:16px;margin-left:2px}

.entry-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:var(--entry-bg,linear-gradient(135deg,rgba(91,75,255,.24),rgba(139,123,255,.06)));cursor:pointer;transition:.25s cubic-bezier(.2,.9,.3,1);margin-bottom:12px;width:100%;text-align:left;color:#fff;font-family:inherit;border:1px solid var(--entry-border,rgba(139,123,255,.2));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);position:relative;overflow:hidden}
.entry-row:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25)}
.entry-row::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);opacity:0;transition:.3s;pointer-events:none}
.entry-row:hover::before{opacity:1}
.entry-icon{width:56px;height:56px;border-radius:14px;background:var(--entry-icon-bg,linear-gradient(135deg,#5B4BFF,#8B7BFF));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden;position:relative;z-index:1;color:#fff}
.entry-icon img{width:100%;height:100%;object-fit:cover}
.entry-icon svg{width:28px;height:28px;fill:#fff;opacity:.9;stroke:currentColor}
.entry-info{flex:1;min-width:0;position:relative;z-index:1}
.entry-info .t{font-size:16px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-info .s{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:3px}
.entry-row .arrow{width:22px;height:22px;color:rgba(255,255,255,.5);flex-shrink:0;position:relative;z-index:1}

.track{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.15s;position:relative}
.track:hover{background:var(--hover)}
.track.active{background:linear-gradient(90deg,rgba(255,255,255,.1),transparent)}
.track.dragging{opacity:.4}
.track.drag-over{box-shadow:inset 0 -2px 0 #fff}
.track-art{width:46px;height:46px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:rgba(255,255,255,.35);overflow:hidden;position:relative}
.track-art img{width:100%;height:100%;object-fit:cover}
.track-art svg.placeholder{width:20px;height:20px;opacity:.25}
.track.active .track-art::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(2px)}
.track.active .track-art::before{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;z-index:2;animation:playingPulse 1.4s ease-in-out infinite}
@keyframes playingPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
.track-info{flex:1;min-width:0}
.track-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:12.5px;color:var(--dim2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-dur{font-size:12.5px;color:var(--dim2);flex-shrink:0;font-variant-numeric:tabular-nums}
.track-actions{display:flex;gap:2px;flex-shrink:0}
.track-action{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--dim2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.track-action:hover{background:rgba(255,255,255,.1);color:#fff}
.track-action.liked{color:#ff5577}
.track-action.liked svg{fill:#ff5577}
.drag-handle{cursor:grab;padding:0 2px;color:var(--dim2)}
.drag-handle:active{cursor:grabbing}

.empty{padding:60px 20px;text-align:center;color:var(--dim2)}
.empty svg{width:44px;height:44px;margin-bottom:14px;opacity:.5}
.empty-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--dim);line-height:1.5}
.empty button{margin-top:16px;padding:10px 22px;border-radius:999px;background:#fff;color:#000;border:none;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}

.sk-card{width:100%}
.sk-art{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.07);animation:skPulse 1.5s ease-in-out infinite}
.sk-title{height:14px;margin-top:10px;border-radius:4px;background:rgba(255,255,255,.07);width:70%;animation:skPulse 1.5s ease-in-out infinite}
.sk-sub{height:12px;margin-top:8px;border-radius:4px;background:rgba(255,255,255,.05);width:45%;animation:skPulse 1.5s ease-in-out infinite}
@keyframes skPulse{0%,100%{opacity:.6}50%{opacity:1}}
.loading-text{text-align:center;padding:20px 0;color:var(--dim);font-size:13px}

.player{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--sa-bottom));z-index:150;display:none;flex-direction:column;gap:12px;padding:14px 16px 12px;background:rgba(18,18,18,.7);backdrop-filter:blur(50px) saturate(200%);-webkit-backdrop-filter:blur(50px) saturate(200%);border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(calc(100% + 24px));opacity:0;transition:transform .4s cubic-bezier(.2,.9,.3,1),opacity .3s}
.player.visible{display:flex;transform:translateY(0);opacity:1}
.player-main{display:flex;align-items:center;gap:12px;min-width:0}
.player-art{width:54px;height:54px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.player-art img{width:100%;height:100%;object-fit:cover}
.player-art svg.placeholder{width:22px;height:22px;opacity:.3}
.player-info{flex:1;min-width:0}
.player-title-wrap{overflow:hidden;position:relative}
.player-title{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;display:inline-block;transition:transform .3s}
.player-title.marquee{animation:titleScroll 7s ease-in-out infinite}
@keyframes titleScroll{0%,12%{transform:translateX(0)}45%,55%{transform:translateX(var(--mq,-0px))}88%,100%{transform:translateX(0)}}
.player-artist{font-size:12.5px;color:var(--dim2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-actions{display:flex;gap:2px;flex-shrink:0}
.player-actions .mini-act{width:36px;height:36px;border-radius:50%;background:transparent;border:none;color:var(--dim2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.player-actions .mini-act:hover{background:rgba(255,255,255,.1);color:#fff}
.player-actions .mini-act.liked{color:#ff5577}
.player-actions .mini-act.liked svg{fill:#ff5577}
.player-actions .mini-act svg{width:18px;height:18px}
.player-bottom{display:flex;align-items:center;gap:12px}
.player-bottom .play-btn{width:38px;height:38px;border-radius:50%;background:#fff;color:#000;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;box-shadow:0 6px 18px rgba(255,255,255,.2)}
.player-bottom .play-btn:hover{transform:scale(1.06)}
.player-bottom .play-btn svg{width:16px;height:16px}
.player-bottom .progress-line{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:2px;cursor:pointer;position:relative}
.player-bottom .progress-line::before{content:'';position:absolute;inset:-10px 0}
.player-bottom .progress-fill{height:100%;background:#fff;border-radius:2px;width:0%;position:relative;transition:width .1s linear}
.player-bottom .progress-fill::after{content:'';position:absolute;right:-5px;top:50%;width:10px;height:10px;background:#fff;border-radius:50%;transform:translateY(-50%) scale(0);transition:.15s}
.player-bottom .progress-line:hover .progress-fill::after{transform:translateY(-50%) scale(1)}

.fp{position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column;padding:calc(20px + var(--sa-top)) 24px calc(32px + var(--sa-bottom));transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.9,.3,1);overflow:hidden;visibility:hidden}
.fp.open{transform:translateY(0);visibility:visible}
.fp-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,var(--fp-color,rgba(255,255,255,.1)),transparent 60%);opacity:.5;pointer-events:none;transition:background .6s;z-index:0}
.fp-head{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;flex-shrink:0;gap:8px}
.fp-tag{font-size:11px;color:var(--dim2);letter-spacing:1.8px;text-transform:uppercase;font-weight:600;flex:1;text-align:center}
.fp-head-right{display:flex;gap:8px;align-items:center}
.fp-back-btn{display:none}
.fp.show-video .fp-back-btn{display:flex}
.fp-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;position:relative;z-index:1;min-height:0;padding:12px 0}
.fp-art{width:min(70vw,340px);height:min(70vw,340px);border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.02));box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;display:flex;align-items:center;justify-content:center;transition:transform .4s;position:relative;cursor:default}
.fp-art img{width:100%;height:100%;object-fit:cover}
.fp-art svg.placeholder{width:80px;height:80px;opacity:.15}
.fp-art.clickable{cursor:pointer}
.fp-art.clickable:hover::after{opacity:1}
.fp-art::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.5),rgba(0,0,0,.7));opacity:0;transition:.25s;pointer-events:none}
.fp-art-hint{position:absolute;bottom:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;color:#fff;z-index:2;pointer-events:none;border:1px solid rgba(255,255,255,.15)}
.fp-art.clickable .fp-art-hint{display:flex}
.fp-art-hint svg{width:18px;height:18px}
.fp.playing .fp-art{animation:pulseArt 4s ease-in-out infinite}
@keyframes pulseArt{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

.fp-video-wrap{width:min(90vw,560px);aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.7);display:none;position:relative}
.fp-video-wrap iframe{width:100% !important;height:100% !important;border:0 !important;display:block}
.fp.show-video .fp-video-wrap{display:block}
.fp.show-video .fp-art{display:none}

.fp-info{text-align:center;width:100%;max-width:520px;padding:0 8px}
.fp-title-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px;width:100%}
.fp-title-wrap{overflow:hidden;flex:1;max-width:400px;margin:0 auto}
.fp-title{font-size:24px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;display:inline-block;transition:transform .3s}
.fp-title.marquee{animation:titleScroll 7s ease-in-out infinite}
.fp-artist{font-size:14.5px;color:var(--dim)}
.fp-like{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:none;color:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.fp-like:hover{background:rgba(255,255,255,.12);color:#fff}
.fp-like svg{width:22px;height:22px;transition:.25s}
.fp-like.liked{color:#ff5577}
.fp-like.liked svg{fill:#ff5577}
.fp-progress-wrap{width:100%;max-width:520px;margin-top:10px;position:relative;z-index:1}
.fp-progress-wrap .progress{height:5px;background:rgba(255,255,255,.12);border-radius:3px;cursor:pointer;position:relative}
.fp-progress-wrap .progress::before{content:'';position:absolute;inset:-12px 0}
.fp-progress-wrap .progress-fill{height:100%;background:#fff;border-radius:3px;width:0%;transition:width .1s linear}
.fp-time-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim2);margin-top:8px;font-variant-numeric:tabular-nums}
.fp-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:4px;position:relative;z-index:1}
.fp-ctl{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;position:relative}
.fp-ctl:hover{background:rgba(255,255,255,.12);transform:scale(1.04)}
.fp-ctl:active{transform:scale(.94)}
.fp-ctl svg{width:22px;height:22px;pointer-events:none}
.fp-ctl.active{color:#fff;background:rgba(255,255,255,.12)}
.fp-ctl.active::after{content:'';position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:#fff}
.fp-ctl.play{width:72px;height:72px;background:#fff;color:#000;border:none;box-shadow:0 10px 30px rgba(255,255,255,.2)}
.fp-ctl.play:hover{background:#f0f0f0;transform:scale(1.06)}
.fp-ctl.play svg{width:26px;height:26px}
.fp-ctl.small{width:44px;height:44px}
.fp-ctl.small svg{width:18px;height:18px}
.fp-ad-badge{position:absolute;top:calc(70px + var(--sa-top));left:50%;transform:translateX(-50%);background:rgba(255,80,80,.15);color:#ff7070;padding:5px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:1.2px;border:1px solid rgba(255,80,80,.3);z-index:10;backdrop-filter:blur(20px)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:.25s}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{width:100%;max-width:620px;background:rgba(20,20,20,.88);backdrop-filter:blur(50px) saturate(180%);-webkit-backdrop-filter:blur(50px) saturate(180%);border:1px solid rgba(255,255,255,.12);border-bottom:none;border-radius:26px 26px 0 0;padding:20px 20px calc(40px + var(--sa-bottom));transform:translateY(100%);transition:.35s cubic-bezier(.2,.9,.3,1);max-height:85vh;overflow-y:auto;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.modal.open .modal-card{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h3{font-size:18px;font-weight:700;letter-spacing:-.3px}
.modal-close{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06);color:#fff;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.15s}
.modal-close:hover{background:rgba(255,255,255,.16);transform:rotate(90deg)}
.modal-close svg{width:16px;height:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--dim2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.field input[type=text]{width:100%;height:50px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:0 16px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:.15s}
.field input[type=text]:focus{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1;height:50px;border-radius:14px;border:none;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.modal-actions .btn.primary{background:#fff;color:#000}
.modal-actions .btn.primary:hover{background:#f0f0f0}
.modal-actions .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.08)}
.modal-actions .btn.ghost:hover{background:rgba(255,255,255,.14)}
.modal-actions .btn.danger{background:rgba(255,80,80,.15);color:#ff7070}
.modal-actions .btn.danger:hover{background:rgba(255,80,80,.25)}

<script>
(() => {
'use strict';

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{if(!isFinite(s)||s<0)s=0;const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0');};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

function cleanTitle(title){
  if(!title)return '';
  return title
    .replace(/\s*[\(\[]\s*(clip\s*officiel|official\s*(music\s*)?video|official\s*audio|lyric\s*video|lyrics?|audio\s*only|audio|hd|hq|4k|mv|m\/v)\s*[\)\]]/gi, '')
    .replace(/\s*[\(\[]\s*(clip|video|vidéo)\s*(officiel|officielle|official)?\s*[\)\]]/gi, '')
    .replace(/\s{2,}/g,' ')
    .trim() || title;
}

const DB=(()=>{let p=null;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('2am-db',2);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files');if(!db.objectStoreNames.contains('thumbs'))db.createObjectStore('thumbs');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));return{
  async put(s,k,v){const db=await open();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async get(s,k){const db=await open();return new Promise((res,rej)=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async del(s,k){const db=await open();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
};})();

const S={
  tracks:[],playlists:[],liked:[],
  cur:-1,playing:false,shuffle:false,repeat:0,vol:1,
  pendingTrack:null,currentPlaylistId:null,
  adPlaying:false,editingTrackId:null,editingPlId:null,editingPlIsNew:false,
  view:'home',queue:null,trending:[],trendingRegion:'',
  fullscreenOpen:false,playlistContext:null,
  sortMode:{},colorCache:{},recCache:{},
  showVideo:false
};
const LS='2am:v12';
const audio=new Audio();audio.preload='metadata';

let trendingStatus='idle';
let trendingError='';

function save(){
  const data={
    tracks:S.tracks.map(t=>({id:t.id,title:t.title,artist:t.artist,type:t.type,src:t.type==='file'?null:t.src,ytId:t.ytId,thumb:t.thumb,duration:t.duration||0})),
    playlists:S.playlists.map(p=>({id:p.id,name:p.name,trackIds:p.trackIds})),
    liked:S.liked,sortMode:S.sortMode
  };
  try{localStorage.setItem(LS,JSON.stringify(data));}catch(e){}
}
async function restore(){
  let d=null;try{d=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
  if(!d)return;
  S.playlists=d.playlists||[];
  S.liked=d.liked||[];
  S.sortMode=d.sortMode||{};
  for(const m of (d.tracks||[])){
    let src=m.src;
    if(m.type==='file'){try{const b=await DB.get('files',m.id);if(!b)continue;src=URL.createObjectURL(b);}catch(e){continue;}}
    S.tracks.push({...m,src});
  }
}

function parseName(name){
  const base=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const p=base.split(' - ');
  if(p.length>=2)return{artist:p[0].trim()||'Artiste inconnu',title:cleanTitle(p.slice(1).join(' - ').trim())};
  return{artist:'Artiste inconnu',title:cleanTitle(base)||'Sans titre'};
}
function probeDuration(src){return new Promise(res=>{const a=new Audio();a.preload='metadata';a.src=src;let done=false;const f=d=>{if(!done){done=true;res(d||0);}};a.onloadedmetadata=()=>f(a.duration);a.onerror=()=>f(0);setTimeout(()=>f(0),8000);});}
function userRegion(){try{const lang=navigator.language||'fr-FR';const code=lang.split('-')[1];return (code||'FR').toUpperCase().slice(0,2);}catch(e){return 'FR';}}
function isLiked(id){return S.liked.includes(id);}

function rgbToCss(c,a=1){return `rgba(${c.r},${c.g},${c.b},${a})`;}
function extractColor(url){
  if(!url)return Promise.resolve({r:90,g:75,b:180});
  if(S.colorCache[url])return Promise.resolve(S.colorCache[url]);
  return new Promise(resolve=>{
    const img=new Image();img.crossOrigin='anonymous';
    const timeout=setTimeout(()=>resolve({r:90,g:75,b:180}),4000);
    img.onload=()=>{
      clearTimeout(timeout);
      try{
        const size=40;const c=document.createElement('canvas');c.width=size;c.height=size;
        const ctx=c.getContext('2d');ctx.drawImage(img,0,0,size,size);
        const d=ctx.getImageData(0,0,size,size).data;
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<d.length;i+=4){
          const rr=d[i],gg=d[i+1],bb=d[i+2],a=d[i+3];
          if(a<200)continue;const lum=(rr+gg+bb)/3;
          if(lum<35||lum>225)continue;
          r+=rr;g+=gg;b+=bb;n++;
        }
        if(n===0){r=90;g=75;b=180;n=1;}
        let R=r/n,G=g/n,B=b/n;const avg=(R+G+B)/3;
        R=Math.min(255,avg+(R-avg)*1.25);G=Math.min(255,avg+(G-avg)*1.25);B=Math.min(255,avg+(B-avg)*1.25);
        const col={r:Math.round(R),g:Math.round(G),b:Math.round(B)};
        S.colorCache[url]=col;resolve(col);
      }catch(e){clearTimeout(timeout);resolve({r:90,g:75,b:180});}
    };
    img.onerror=()=>{clearTimeout(timeout);resolve({r:90,g:75,b:180});};
    img.src=url;
  });
}

async function importFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|flac|m4a|aac|ogg|opus|wma|aiff|alac)$/i.test(f.name));
  if(!list.length){toast('Aucun fichier audio valide');return;}
  let added=0;
  for(const f of list){
    const id=uid();
    try{await DB.put('files',id,f);}catch(e){continue;}
    const {artist,title}=parseName(f.name);
    const track={id,title,artist,type:'file',src:URL.createObjectURL(f),duration:0};
    S.tracks.push(track);
    probeDuration(track.src).then(d=>{if(d){track.duration=d;save();}});
    added++;
  }
  save();renderCurrentView();
  toast(added+(added>1?' titres importés':' titre importé'));
  closeImport();
}

async function fetchOnline(params){
  const qs=new URLSearchParams(params).toString();
  const r=await fetch('/api/youtube?'+qs);
  if(!r.ok){
    let msg='Erreur API ('+r.status+')';
    try{const e=await r.json();if(e.error)msg=e.error;}catch(_){}
    throw new Error(msg);
  }
  return await r.json();
}
function normalize(item){
  const id=typeof item.id==='string'?item.id:item.id?.videoId;
  if(!id)return null;
  const thumbs=item.snippet.thumbnails||{};
  const thumb=(thumbs.maxres||thumbs.standard||thumbs.high||thumbs.medium||thumbs.default||{}).url||'';
  return{ytId:id,title:cleanTitle(item.snippet.title),channel:item.snippet.channelTitle,thumb};
}
async function searchOnline(q){
  const d=await fetchOnline({q});
  return (d.items||[]).map(normalize).filter(Boolean);
}
async function loadTrending(){
  const region=userRegion();
  S.trendingRegion=region;
  const d=await fetchOnline({region});
  return (d.items||[]).map(normalize).filter(Boolean);
}
async function loadRecommendations(seedTitle){
  if(!seedTitle)return [];
  const key=seedTitle.toLowerCase().slice(0,30);
  if(S.recCache[key])return S.recCache[key];
  try{
    const d=await fetchOnline({q:seedTitle});
    const r=(d.items||[]).map(normalize).filter(Boolean).slice(0,10);
    S.recCache[key]=r;
    return r;
  }catch(e){return [];}
}

let ytPlayer=null,ytReady=false,ytPending=null,ytPollTimer=null,adPollTimer=null;
window.onYouTubeIframeAPIReady=function(){
  try{
    ytPlayer=new YT.Player('ytPlayer',{height:'200',width:'200',playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,playsinline:1},
      events:{
        onReady:()=>{ytReady=true;if(ytPending){const id=ytPending;ytPending=null;ytLoad(id);}},
        onStateChange:e=>{
          if(e.data===YT.PlayerState.ENDED)nextTrack(true);
          else if(e.data===YT.PlayerState.PLAYING){S.playing=true;updatePlayIcon();startPoll();renderPlayer();}
          else if(e.data===YT.PlayerState.PAUSED){S.playing=false;updatePlayIcon();renderPlayer();}
          else if(e.data===YT.PlayerState.BUFFERING){startAdPoll();}
        },
        onError:()=>{toast('Lecture impossible');nextTrack(true);}
      }});
  }catch(e){console.warn('YT init failed',e);}
};
function loadYTAPI(){if(window.YT&&window.YT.Player){window.onYouTubeIframeAPIReady();return;}const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);}
function ytLoad(videoId){
  if(!ytReady||!ytPlayer){ytPending=videoId;return;}
  try{ytPlayer.loadVideoById(videoId);ytPlayer.setVolume(100);}catch(e){}
  S.adPlaying=false;updateAdUI();startAdPoll();
}
function startAdPoll(){
  stopAdPoll(true);
  adPollTimer=setInterval(()=>{
    if(!ytPlayer||!ytPlayer.getVideoData)return;
    let data;try{data=ytPlayer.getVideoData();}catch(e){return;}
    const t=S.tracks[S.cur];
    if(!t||t.type!=='yt')return;
    const isAd=data&&data.video_id&&data.video_id!==t.ytId;
    if(isAd!==S.adPlaying){S.adPlaying=isAd;updateAdUI();}
  },800);
}
function stopAdPoll(keep){
  if(adPollTimer){clearInterval(adPollTimer);adPollTimer=null;}
  if(!keep){S.adPlaying=false;updateAdUI();}
}
function updateAdUI(){

function updateMediaSession(track){
  if(!('mediaSession' in navigator))return;
  if(!track){navigator.mediaSession.metadata=null;return;}
  const art=[];
  if(track.thumb&&track.thumb.startsWith('http'))art.push({src:track.thumb,sizes:'512x512',type:'image/jpeg'});
  try{navigator.mediaSession.metadata=new MediaMetadata({title:track.title,artist:track.artist,album:'2AM',artwork:art});}catch(e){}
  try{
    navigator.mediaSession.setActionHandler('play',()=>{if(!S.playing)toggle();});
    navigator.mediaSession.setActionHandler('pause',()=>{if(S.playing)toggle();});
    navigator.mediaSession.setActionHandler('nexttrack',()=>nextTrack(false));
    navigator.mediaSession.setActionHandler('previoustrack',()=>prevTrack());
  }catch(e){}
}

/* ===== Playback ===== */
function getPool(){
  if(S.queue&&S.queue.length){
    return S.queue.map(id=>S.tracks.find(t=>t.id===id)).filter(Boolean);
  }
  return S.tracks.slice();
}

function playTrack(idxOrTrack, opts){
  let idx;
  if(typeof idxOrTrack==='number')idx=idxOrTrack;
  else idx=S.tracks.indexOf(idxOrTrack);
  if(idx<0||idx>=S.tracks.length)return;

  S.cur=idx;
  const t=S.tracks[idx];
  if(opts&&opts.queue!==undefined)S.queue=opts.queue;
  if(opts&&opts.context!==undefined)S.playlistContext=opts.context;

  S.adPlaying=false;updateAdUI();
  // Reset video mode
  S.showVideo=false;
  updateMediaSession(t);

  stopPoll();
  try{audio.pause();}catch(e){}
  try{if(ytPlayer&&ytPlayer.pauseVideo)ytPlayer.pauseVideo();}catch(e){}

  if(t.type==='yt'){
    try{audio.removeAttribute('src');audio.load();}catch(e){}
    ytLoad(t.ytId);
    S.playing=true;
    updatePlayIcon();
    renderCurrentView();
  }else{
    audio.src=t.src;
    audio.play().then(()=>{
      S.playing=true;
      updatePlayIcon();
      renderCurrentView();
    }).catch(err=>{
      console.warn('play error',err);
      S.playing=false;updatePlayIcon();renderCurrentView();
      toast('Lecture impossible');
    });
  }
  openFullscreen();
}

function toggle(){
  if(S.cur<0){if(S.tracks.length)playTrack(0);return;}
  const t=S.tracks[S.cur];
  if(t.type==='yt'){
    if(!ytPlayer||!ytPlayer.getPlayerState)return;
    const st=ytPlayer.getPlayerState();
    if(st===1){ytPlayer.pauseVideo();S.playing=false;}
    else{ytPlayer.playVideo();S.playing=true;}
  }else{
    if(audio.paused)audio.play().then(()=>{S.playing=true;updatePlayIcon();renderPlayer();}).catch(()=>toast('Lecture impossible'));
    else{audio.pause();S.playing=false;}
  }
  updatePlayIcon();
  if(S.playing)$('#fp').classList.add('playing');else $('#fp').classList.remove('playing');
  renderPlayer();
}

function nextTrack(auto=false){
  if(!S.tracks.length)return;
  if(S.repeat===2&&auto){
    const t=S.tracks[S.cur];
    if(t.type==='yt'&&ytPlayer){try{ytPlayer.seekTo(0);ytPlayer.playVideo();}catch(e){}}
    else{audio.currentTime=0;audio.play().catch(()=>{});}
    return;
  }
  const pool=getPool();
  if(!pool.length)return;

  if(S.shuffle&&pool.length>1){
    const curId=S.tracks[S.cur]?.id;
    let pick=null,tries=0;
    while(tries<30){
      const cand=pool[Math.floor(Math.random()*pool.length)];
      if(cand.id!==curId){pick=cand;break;}
      tries++;
    }
    if(!pick)pick=pool[Math.floor(Math.random()*pool.length)];
    playTrack(pick);
    return;
  }

  const curId=S.tracks[S.cur]?.id;
  let pos=pool.findIndex(t=>t.id===curId);
  if(pos<0)pos=-1;
  let nPos=pos+1;
  if(nPos>=pool.length){
    if(S.repeat===1||!auto)nPos=0;
    else{S.playing=false;updatePlayIcon();renderPlayer();return;}
  }
  playTrack(pool[nPos]);
}

function prevTrack(){
  if(!S.tracks.length)return;
  const t=S.tracks[S.cur];
  if(t){
    const ct=t.type==='yt'?(ytPlayer?.getCurrentTime?.()||0):audio.currentTime;
    if(ct>3){
      if(t.type==='yt'&&ytPlayer)try{ytPlayer.seekTo(0);}catch(e){}
      else audio.currentTime=0;
      return;
    }
  }
  const pool=getPool();
  if(!pool.length)return;
  const curId=S.tracks[S.cur]?.id;
  let pos=pool.findIndex(t=>t.id===curId);
  if(pos<0)pos=0;
  pos=(pos-1+pool.length)%pool.length;
  playTrack(pool[pos]);
}

async function deleteTrack(idx){
  const t=S.tracks[idx];if(!t)return;
  S.tracks.splice(idx,1);
  S.liked=S.liked.filter(id=>id!==t.id);
  S.playlists.forEach(p=>{p.trackIds=p.trackIds.filter(id=>id!==t.id);});
  if(S.queue)S.queue=S.queue.filter(id=>id!==t.id);
  if(t.type==='file'){try{await DB.del('files',t.id);}catch(e){}if(t.src)URL.revokeObjectURL(t.src);}
  if(S.cur===idx){
    try{audio.pause();audio.removeAttribute('src');audio.load();}catch(e){}
    try{if(ytPlayer&&ytPlayer.stopVideo)ytPlayer.stopVideo();}catch(e){}
    stopPoll();stopAdPoll();
    S.cur=-1;S.playing=false;
    closeFullscreen();
    updatePlayIcon();
  }else if(S.cur>idx)S.cur--;
  save();renderCurrentView();toast('Titre supprimé');
}

function bindProgress(el,fillEl){
  let drag=false;
  function seekAt(x){
    const r=el.getBoundingClientRect();const p=Math.max(0,Math.min(1,(x-r.left)/r.width));
    fillEl.style.width=(p*100)+'%';
    const t=S.tracks[S.cur];if(!t)return;
    if(t.type==='yt'){if(ytPlayer&&ytPlayer.getDuration){const d=ytPlayer.getDuration();if(d)try{ytPlayer.seekTo(p*d,true);}catch(e){}}}
    else{if(audio.duration)audio.currentTime=p*audio.duration;}
  }
  el.addEventListener('pointerdown',e=>{drag=true;el.setPointerCapture(e.pointerId);seekAt(e.clientX);});
  el.addEventListener('pointermove',e=>{if(drag)seekAt(e.clientX);});
  el.addEventListener('pointerup',()=>drag=false);
  el.addEventListener('pointercancel',()=>drag=false);
}

function applyMarquee(el){
  if(!el)return;
  el.classList.remove('marquee');
  el.style.removeProperty('--mq');
  requestAnimationFrame(()=>{
    const wrap=el.parentElement;if(!wrap)return;
    const overflow=el.scrollWidth-wrap.clientWidth;
    if(overflow>4){
      el.style.setProperty('--mq',`-${overflow+8}px`);
      el.classList.add('marquee');
    }
  });
}

function renderPlaylistView(){
  const isLikedView=S.currentPlaylistId==='liked';
  const p=isLikedView?null:S.playlists.find(x=>x.id===S.currentPlaylistId);
  if(!isLikedView&&!p){setView('library');return;}
  let tracks=isLikedView?S.tracks.filter(t=>S.liked.includes(t.id)):p.trackIds.map(id=>S.tracks.find(t=>t.id===id)).filter(Boolean);

  const sortKey=isLikedView?'liked':p.id;
  const mode=S.sortMode[sortKey]||'manual';
  if(mode==='az')tracks=[...tracks].sort((a,b)=>a.title.localeCompare(b.title,'fr'));
  else if(mode==='za')tracks=[...tracks].sort((a,b)=>b.title.localeCompare(a.title,'fr'));
  else if(mode==='dur')tracks=[...tracks].sort((a,b)=>(b.duration||0)-(a.duration||0));

  const sortLabels={manual:'Manuel',az:'A → Z',za:'Z → A',dur:'Durée'};
  const name=isLikedView?'Titres aimés':p.name;
  const cover=isLikedView?null:(tracks[0]?.thumb||null);
  const el=$('#viewPlaylist');
  const art=isLikedView
    ?'<svg viewBox="0 0 24 24" style="fill:#fff;width:56px;height:56px"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>'
    :(cover?`<img src="${esc(cover)}" alt="" crossorigin="anonymous">`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:56px;height:56px;opacity:.4"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>');

  const ctx=isLikedView?'liked':p.id;
  el.innerHTML=`
    <div class="pl-glow" id="plGlow"></div>
    <button class="icon-btn" id="backBtn" style="margin-bottom:8px;position:relative;z-index:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="pl-head">
      <div class="pl-cover" ${isLikedView?'style="background:linear-gradient(135deg,#5B4BFF,#8B7BFF)"':''}>${art}</div>
      <div class="pl-info">
        <div class="kind">${isLikedView?'Collection':'Playlist'}</div>
        <h2>${esc(name)}</h2>
        <div class="meta">${tracks.length} titre${tracks.length>1?'s':''}</div>
      </div>
    </div>
    <div class="pl-actions">
      <button class="pl-play" id="plPlay" ${tracks.length?'':'disabled'}>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Lecture
      </button>
      <button class="pl-mini" id="plSortBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h13M3 12h9M3 18h5M18 8v9M18 8l-3 3M18 8l3 3"/></svg>
        Trier : ${esc(sortLabels[mode])}
      </button>
      ${!isLikedView?`<button class="pl-mini" id="plEditBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Modifier</button>`:''}
    </div>
    <div id="plTracks">${tracks.length?tracks.map(t=>trackRowHTML(t,{fromPlaylist:isLikedView?null:p.id,draggable:!isLikedView&&mode==='manual'})).join(''):'<div class="empty"><div class="empty-title">Playlist vide</div><div class="empty-sub">Ajoutez des titres depuis la recherche</div></div>'}</div>
    ${!isLikedView&&tracks.length?'<div id="plRecs"></div>':''}
  `;

  if(cover){
    extractColor(cover).then(c=>{
      const g=$('#plGlow');if(g)g.style.setProperty('--pl-color',rgbToCss(c,.55));
    });
  }else if(isLikedView){
    const g=$('#plGlow');if(g)g.style.setProperty('--pl-color','rgba(91,75,255,.5)');
  }

  $('#backBtn').onclick=()=>setView('library');
  const plPlay=$('#plPlay');
  if(plPlay)plPlay.onclick=()=>{if(!tracks.length)return;const ids=tracks.map(t=>t.id);playTrack(tracks[0],{queue:ids,context:ctx});};
  const plEditBtn=$('#plEditBtn');
  if(plEditBtn)plEditBtn.onclick=()=>openEditPlaylist(p.id);
  const plSortBtn=$('#plSortBtn');
  if(plSortBtn)plSortBtn.onclick=()=>openSortPicker(sortKey,mode);

  el.querySelectorAll('#plTracks .track').forEach(row=>{
    row.addEventListener('click',e=>{
      const like=e.target.closest('[data-like]');
      if(like){e.stopPropagation();toggleLikeByIdx(+like.dataset.like);return;}
      const rm=e.target.closest('[data-removefrom]');
      if(rm){e.stopPropagation();const pid=rm.dataset.removefrom;const tid=rm.dataset.trackid;const pl=S.playlists.find(x=>x.id===pid);if(pl){pl.trackIds=pl.trackIds.filter(id=>id!==tid);save();renderPlaylistView();toast('Retiré de la playlist');}return;}
      const del=e.target.closest('[data-del]');
      if(del){e.stopPropagation();deleteTrack(+del.dataset.del);return;}
      const idx=+row.dataset.idx;
      if(idx===S.cur)toggle();else playTrack(idx,{queue:ids,context:ctx});
    });
  });
  if(!isLikedView&&tracks.length&&mode==='manual')enableDragReorder(el,p);

  if(!isLikedView&&tracks.length){
    const seed=tracks[tracks.length-1];
    const seedStr=((seed.artist||'')+' '+(seed.title||'')).trim();
    loadRecommendations(seedStr).then(recs=>{
      const filtered=recs.filter(r=>{
        if(S.tracks.some(t=>t.ytId===r.ytId&&p.trackIds.includes(t.id)))return false;
        return true;
      }).slice(0,8);
      if(!filtered.length)return;
      const recEl=$('#plRecs');
      if(!recEl)return;
      recEl.innerHTML=`<h2 class="section-title" style="margin-top:24px"><span>Recommandations</span></h2>
        <div class="rec-row">${filtered.map((r,i)=>`
          <div class="rec-card" data-rec="${i}">
            <div class="rec-art"><img src="${esc(r.thumb)}" alt="" loading="lazy"></div>
            <div class="rec-title">${esc(r.title)}</div>
            <div class="rec-sub">${esc(r.channel)}</div>
            <button class="rec-add" data-recadd="${i}" title="Ajouter à la playlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>`).join('')}</div>`;
      recEl.querySelectorAll('[data-recadd]').forEach(btn=>{
        btn.onclick=(e)=>{
          e.stopPropagation();
          const i=+btn.dataset.recadd;
          const item=filtered[i];
          if(!item)return;
          let existing=S.tracks.find(t=>t.ytId===item.ytId);
          if(!existing){
            existing={id:uid(),title:item.title,artist:item.channel,type:'yt',ytId:item.ytId,thumb:item.thumb,duration:0,src:'https://www.youtube.com/watch?v='+item.ytId};
            S.tracks.push(existing);
          }
          if(!p.trackIds.includes(existing.id))p.trackIds.push(existing.id);
          save();
          toast('Ajouté à la playlist');
          renderPlaylistView();
        };
      });
    });
  }
}

function enableDragReorder(container,p){
  let dragIdx=null;
  container.querySelectorAll('.track[draggable]').forEach(row=>{
    row.addEventListener('dragstart',e=>{dragIdx=+row.dataset.idx;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');container.querySelectorAll('.track').forEach(r=>r.classList.remove('drag-over'));});
    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault();
      const targetIdx=+row.dataset.idx;
      if(dragIdx===null||dragIdx===targetIdx)return;
      const draggedTrack=S.tracks[dragIdx],targetTrack=S.tracks[targetIdx];
      const fromP=p.trackIds.indexOf(draggedTrack.id),toP=p.trackIds.indexOf(targetTrack.id);
      if(fromP<0||toP<0)return;
      p.trackIds.splice(fromP,1);p.trackIds.splice(toP,0,draggedTrack.id);
      save();renderPlaylistView();toast('Ordre mis à jour');
    });
  });
}

function openSortPicker(sortKey,current){
  const opts=[
    {id:'manual',label:'Ordre manuel'},

    {id:'za',label:'Titre (Z → A)'},
    {id:'dur',label:'Durée'}
  ];
  $('#sortList').innerHTML=opts.map(o=>`

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${o.id==='manual'?'<path d="M3 6h13M3 12h9M3 18h5M18 8v9M18 8l-3 3M18 8l3 3"/>':o.id==='az'?'<path d="M4 17l4-12 4 12M5 13h6M14 8l4 9 4-9M14 17h8"/>':o.id==='za'?'<path d="M4 7l4 12 4-12M5 11h6M20 8l-4 9-4-9M12 17h8"/>':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>'}</svg>
      <span>${o.label}</span>
      ${o.id===current?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:#fff"><path d="M5 12l5 5 9-11"/></svg>':''}
    </div>`).join('');
  sortPicker.classList.add('open');
  sortPicker.querySelectorAll('[data-sortopt]').forEach(item=>{
    item.onclick=()=>{
      S.sortMode[sortKey]=item.dataset.sortopt;save();
      sortPicker.classList.remove('open');
      renderPlaylistView();
      toast('Tri : '+opts.find(o=>o.id===item.dataset.sortopt).label);
    };
  });
}

  const trendCard=e.target.closest('[data-trend]');
  if(trendCard){addTrending(+trendCard.dataset.trend);return;}
  const likedEntry=e.target.closest('[data-liked]');
  if(likedEntry){setView('playlist','liked');return;}
  const plRow=e.target.closest('[data-plid]');
  if(plRow){setView('playlist',plRow.dataset.plid);return;}
  const row=e.target.closest('.track');
  if(row){
    const like=e.target.closest('[data-like]');
    if(like){e.stopPropagation();toggleLikeByIdx(+like.dataset.like);return;}
    const del=e.target.closest('[data-del]');
    if(del){e.stopPropagation();deleteTrack(+del.dataset.del);return;}
    const idx=+row.dataset.idx;
    if(idx===S.cur)toggle();else playTrack(idx,{queue:null,context:null});
  }
});

function findExisting(ytId){return S.tracks.find(t=>t.ytId===ytId);}
async function playTrending(i){
  const item=S.trending[i];if(!item)return;
  let existing=findExisting(item.ytId);
  if(!existing){
    existing={id:uid(),title:item.title,artist:item.channel,type:'yt',ytId:item.ytId,thumb:item.thumb,duration:0,src:'https://www.youtube.com/watch?v='+item.ytId};
    S.tracks.push(existing);save();
  }
  playTrack(existing,{queue:null,context:null});
}
async function addTrending(i){
  const item=S.trending[i];if(!item)return;
  let existing=findExisting(item.ytId);
  if(existing){toast('Déjà dans la bibliothèque');return;}
  const track={id:uid(),title:item.title,artist:item.channel,type:'yt',ytId:item.ytId,thumb:item.thumb,duration:0,src:'https://www.youtube.com/watch?v='+item.ytId};
  S.tracks.push(track);save();
  toast('Ajouté à la bibliothèque');
  S.pendingTrack=track;openPlaylistPicker('Ajouter à une playlist…');
}

$('#openImport').onclick=openImport;
$('#closeImport').onclick=closeImport;
importModal.addEventListener('click',e=>{if(e.target===importModal)closeImport();});
const fileInput=$('#fileInput');
$('#dropZone').onclick=()=>fileInput.click();
fileInput.onchange=e=>{if(e.target.files.length)importFiles(e.target.files);e.target.value='';};
const dz=$('#dropZone');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.add('over');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('over');}));
dz.addEventListener('drop',e=>{if(e.dataTransfer.files.length)importFiles(e.dataTransfer.files);});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{if(e.dataTransfer.files.length&&!importModal.classList.contains('open')){e.preventDefault();importFiles(e.dataTransfer.files);}});

const searchModal=$('#searchModal');
$('#closeSearchModal').onclick=()=>searchModal.classList.remove('open');
searchModal.addEventListener('click',e=>{if(e.target===searchModal)searchModal.classList.remove('open');});
let searchTimer=null;
$('#ytInput').addEventListener('input',e=>{clearTimeout(searchTimer);const q=e.target.value.trim();searchTimer=setTimeout(()=>runSearch(q),400);});
async function runSearch(q){
  const el=$('#ytResults');
  if(!q){el.innerHTML='';return;}
  el.innerHTML='<div class="search-msg">Recherche…</div>';
  try{
    const results=await searchOnline(q);
    if(!results.length){el.innerHTML='<div class="search-msg">Aucun résultat</div>';return;}
    el.innerHTML=results.map(r=>`<div class="search-result" data-ytid="${esc(r.ytId)}" data-title="${esc(r.title)}" data-channel="${esc(r.channel)}" data-thumb="${esc(r.thumb)}">
      <div class="search-result-art"><img src="${esc(r.thumb)}" alt="" loading="lazy"></div>
      <div class="search-result-info"><div class="search-result-title">${esc(r.title)}</div><div class="search-result-channel">${esc(r.channel)}</div></div>
      <button class="search-result-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>`).join('');
  }catch(err){
    el.innerHTML=`<div class="search-msg"><div style="color:#ff6b6b;margin-bottom:8px;font-weight:600">Erreur</div><div>${esc(err.message)}</div></div>`;
  }
}
$('#ytResults').addEventListener('click',e=>{
  const row=e.target.closest('.search-result');if(!row)return;
  addOnlineResult({ytId:row.dataset.ytid,title:row.dataset.title,channel:row.dataset.channel,thumb:row.dataset.thumb});
});
function addOnlineResult(item){
  if(S.tracks.some(t=>t.ytId===item.ytId)){toast('Déjà dans la bibliothèque');return;}
  const track={id:uid(),title:item.title,artist:item.channel,type:'yt',ytId:item.ytId,thumb:item.thumb,duration:0,src:'https://www.youtube.com/watch?v='+item.ytId};
  S.tracks.push(track);save();
  toast('Ajouté à la bibliothèque');
  S.pendingTrack=track;openPlaylistPicker('Ajouter à une playlist…');
}

const picker=$('#playlistPicker');
function openPlaylistPicker(title){
  $('#pickerTitle').textContent=title||'Ajouter à…';
  const list=$('#pickerList');
  list.innerHTML=S.playlists.length?S.playlists.map(p=>`<div class="picker-item" data-plid="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>${esc(p.name)}</span></div>`).join(''):'<div style="padding:14px;text-align:center;color:rgba(255,255,255,.4);font-size:13px">Aucune playlist</div>';
  picker.classList.add('open');setTimeout(()=>$('#newPlName').focus(),200);
}
$('#pickerList').addEventListener('click',e=>{
  const item=e.target.closest('[data-plid]');if(!item)return;
  if(S.pendingTrack){
    const p=S.playlists.find(x=>x.id===item.dataset.plid);
    if(p&&!p.trackIds.includes(S.pendingTrack.id)){p.trackIds.push(S.pendingTrack.id);save();renderCurrentView();toast('Ajouté à '+p.name);}
  }
  picker.classList.remove('open');S.pendingTrack=null;
});
$('#newPlName').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.value.trim()){
    const p={id:uid(),name:e.target.value.trim(),trackIds:[]};
    S.playlists.push(p);
    if(S.pendingTrack)p.trackIds.push(S.pendingTrack.id);
    e.target.value='';save();renderCurrentView();
    picker.classList.remove('open');
    toast('Playlist créée'+(S.pendingTrack?' + titre ajouté':''));
    S.pendingTrack=null;
  }
});
picker.addEventListener('click',e=>{if(e.target===picker){picker.classList.remove('open');S.pendingTrack=null;}});

$('#fpOptions').onclick=()=>{
  if(S.cur<0)return;
  const t=S.tracks[S.cur];
  const liked=isLiked(t.id);
  const inPlaylist=!!S.playlistContext;
  let plName=null,inContext=false;
  if(S.playlistContext==='liked'){plName='Titres aimés';inContext=S.liked.includes(t.id);}
  else if(S.playlistContext){const pl=S.playlists.find(x=>x.id===S.playlistContext);if(pl){plName=pl.name;inContext=pl.trackIds.includes(t.id);}}

  let html=`<h4>Options</h4>
    <div class="picker-item" data-opt="like">
      ${liked?heartFilled:heartOutline}
      <span>${liked?'Retirer des titres aimés':'Ajouter aux titres aimés'}</span>
    </div>
    <div class="picker-item" data-opt="addpl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>Ajouter à une playlist</span>
    </div>`;
  if(inPlaylist&&plName&&inContext){
    html+=`<div class="picker-item" data-opt="removepl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      <span>Retirer de « ${esc(plName)} »</span>
    </div>
    <div class="picker-item" data-opt="edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span>Modifier le titre</span>
    </div>
    <div class="picker-item" data-opt="del">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
      <span>Supprimer</span>
    </div>`;
  }
  $('#trackOptions').querySelector('.picker-card').innerHTML=html;
  $('#trackOptions').classList.add('open');
};
$('#trackOptions').addEventListener('click',e=>{
  if(e.target===$('#trackOptions')){$('#trackOptions').classList.remove('open');return;}
  const item=e.target.closest('[data-opt]');if(!item)return;
  const act=item.dataset.opt;
  $('#trackOptions').classList.remove('open');
  if(act==='like')toggleLikeCurrent();
  else if(act==='addpl'){S.pendingTrack=S.tracks[S.cur];openPlaylistPicker('Ajouter à une playlist…');}
  else if(act==='edit')openEditTrack(S.cur);
  else if(act==='del')deleteTrack(S.cur);
  else if(act==='removepl'){
    const t=S.tracks[S.cur];if(!t)return;
    if(S.playlistContext==='liked'){S.liked=S.liked.filter(lid=>lid!==t.id);toast('Retiré des titres aimés');}
    else if(S.playlistContext){const pl=S.playlists.find(x=>x.id===S.playlistContext);if(pl){pl.trackIds=pl.trackIds.filter(lid=>lid!==t.id);toast('Retiré de la playlist');}}
    save();updateLikeUI();
    if(S.view==='playlist')renderPlaylistView();else renderCurrentView();
  }
});

const editTrackModal=$('#editTrackModal');
function openEditTrack(idx){
  const t=S.tracks[idx];if(!t)return;
  S.editingTrackId=t.id;
  $('#etTitle').value=t.title;$('#etArtist').value=t.artist;
  editTrackModal.classList.add('open');
  setTimeout(()=>$('#etTitle').focus(),250);
}
function closeEditTrack(){editTrackModal.classList.remove('open');S.editingTrackId=null;}
$('#closeEditTrack').onclick=closeEditTrack;
editTrackModal.addEventListener('click',e=>{if(e.target===editTrackModal)closeEditTrack();});
$('#etCancel').onclick=closeEditTrack;
$('#etSave').onclick=()=>{
  const id=S.editingTrackId;if(!id)return;
  const t=S.tracks.find(x=>x.id===id);if(!t)return;
  t.title=$('#etTitle').value.trim()||t.title;
  t.artist=$('#etArtist').value.trim()||t.artist;
  save();renderCurrentView();updateMediaSession(t);
  toast('Titre modifié');closeEditTrack();
};

const editPlModal=$('#editPlModal');
function openNewPlaylist(){
  S.editingPlId=null;S.editingPlIsNew=true;
  $('#plModalTitle').textContent='Nouvelle playlist';
  $('#epName').value='';
  $('#epDelete').style.display='none';
  $('#epSave').textContent='Créer';
  editPlModal.classList.add('open');
  setTimeout(()=>$('#epName').focus(),250);
}
function openEditPlaylist(plId){
  const p=S.playlists.find(x=>x.id===plId);if(!p)return;
  S.editingPlId=plId;S.editingPlIsNew=false;
  $('#plModalTitle').textContent='Modifier la playlist';
  $('#epName').value=p.name;
  $('#epDelete').style.display='block';
  $('#epSave').textContent='Enregistrer';
  editPlModal.classList.add('open');
  setTimeout(()=>$('#epName').focus(),250);
}
function closeEditPl(){editPlModal.classList.remove('open');S.editingPlId=null;S.editingPlIsNew=false;}
$('#closeEditPl').onclick=closeEditPl;
editPlModal.addEventListener('click',e=>{if(e.target===editPlModal)closeEditPl();});
$('#epCancel').onclick=closeEditPl;
$('#epName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#epSave').click();});
$('#epSave').onclick=()=>{
  const name=$('#epName').value.trim();
  if(!name){toast('Entrez un nom');return;}
  if(S.editingPlIsNew){
    const p={id:uid(),name,trackIds:[]};
    S.playlists.push(p);
    save();closeEditPl();
    toast('Playlist créée');
    setView('playlist',p.id);
  }else{
    const p=S.playlists.find(x=>x.id===S.editingPlId);if(!p)return;
    p.name=name;
    save();renderCurrentView();
    toast('Playlist modifiée');closeEditPl();
  }
};
$('#epDelete').onclick=()=>{
  const p=S.playlists.find(x=>x.id===S.editingPlId);if(!p)return;
  if(!confirm('Supprimer la playlist "'+p.name+'" ?'))return;
  S.playlists=S.playlists.filter(x=>x.id!==p.id);
  if(S.playlistContext===p.id)S.playlistContext=null;
  save();closeEditPl();setView('library');
  toast('Playlist supprimée');
};

let toastTimer;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}

let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{applyMarquee($('#pTitle'));applyMarquee($('#fpTitle'));},200);});

(async function init(){
  try{
    updatePlayIcon();
    const v=parseFloat(localStorage.getItem('2am:vol'));
    if(!isNaN(v)){S.vol=v;audio.volume=v;}
    loadYTAPI();
    await restore();
    setView('home');
    renderCurrentView();
  }catch(e){
    console.error('Init error',e);
    document.getElementById('viewHome').innerHTML='<div class="empty" style="padding:80px 20px"><div class="empty-title">Erreur au démarrage</div><div class="empty-sub">'+esc(e.message||'Erreur inconnue')+'</div></div>';
  }
})();

})();
</script>
</body>
</html>
