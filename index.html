<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2AM - Music Without Limits</title>
<link rel="icon" type="image/png" href="/IMG_0838.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BASE & LIQUID GLASS THEME
   ============================================================ */
:root {
  /* Couleurs de fond riches pour faire ressortir la transparence */
  --bg-gradient: radial-gradient(circle at 0% 0%, #2a1b3d 0%, #000000 50%, #0a1128 100%);
  --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.6);
  --accent: #ffffff;
  --danger: #ff453a;
  
  /* Le cœur du Liquid Glass */
  --glass-bg: rgba(255, 255, 255, 0.08);
  --glass-bg-hover: rgba(255, 255, 255, 0.15);
  --glass-border: rgba(255, 255, 255, 0.15);
  --glass-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 8px 32px rgba(0, 0, 0, 0.4);
  --glass-blur: blur(30px) saturate(200%);
  
  --radius: 20px;
  --radius-lg: 32px;
  --radius-pill: 999px;
  --sa-top: env(safe-area-inset-top, 0px);
  --sa-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:#000; }
body {
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  background: var(--bg-gradient);
  background-attachment: fixed;
}

/* ============================================================
   LAYOUT & STRUCTURE APP
   ============================================================ */
.app { height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden; }

/* HEADER */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 16px 20px 10px; padding-top: calc(16px + var(--sa-top));
  flex-shrink:0; gap:12px; z-index:10;
}
.logo-clair { display: none; height:32px; }
.logo-sombre { display: block; height:32px; }
@media (prefers-color-scheme: light) { .logo-clair { display: block; } .logo-sombre { display: none; } }

.header-actions { display:flex; gap:10px; }
.icon-btn {
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-shadow); color: var(--text); cursor:pointer;
  width: 44px; height: 44px; border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.icon-btn:hover { background: var(--glass-bg-hover); transform: scale(1.05); }
.icon-btn:active { transform: scale(0.95); }
.icon-btn svg { width: 20px; height: 20px; }

/* CONTENU PRINCIPAL */
.content {
  flex:1; overflow-y:auto; padding: 10px 20px 120px;
  min-height:0; position:relative; z-index:1;
}
.content::-webkit-scrollbar { display: none; }

/* TYPOGRAPHIE & SECTIONS */
.section { margin-bottom: 32px; }
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
.section-title { font-size: 28px; font-weight: 900; letter-spacing: -1px; color: var(--text); line-height: 1.1; }
.section-title.small { font-size: 20px; letter-spacing: -0.5px; }
.see-all { font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }

/* ============================================================
   BOTTOM NAV (APP STYLE)
   ============================================================ */
.bottom-nav {
  position: fixed; bottom: calc(16px + var(--sa-bottom)); left: 16px; right: 16px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-shadow);
  border-radius: var(--radius-lg); display: flex; justify-content: space-around;
  padding: 10px 10px; z-index: 150;
  transition: transform 0.3s ease;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--text-secondary); font-size: 10px; font-weight: 600;
  cursor: pointer; transition: all 0.2s ease; padding: 8px 16px; border-radius: 16px;
}
.nav-item.active { color: var(--text); background: rgba(255,255,255,0.1); }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }

/* ============================================================
   CARTES & LISTES
   ============================================================ */
/* Listes de titres (Songs You'll Love, Top Songs) */
.track-list { display: flex; flex-direction: column; gap: 12px; }
.track-row { display: flex; align-items: center; gap: 14px; cursor: pointer; padding: 6px; border-radius: 12px; transition: background 0.2s; }
.track-row:hover { background: var(--glass-bg); }
.track-art { width: 56px; height: 56px; border-radius: 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); overflow: hidden; flex-shrink: 0; }
.track-art img { width: 100%; height: 100%; object-fit: cover; }
.track-info { flex: 1; min-width: 0; }
.track-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-artist { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.track-more { color: var(--text-secondary); padding: 8px; }

/* Carrousels Horizontaux (Recommended, Top Albums) */
.carousel { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
.carousel::-webkit-scrollbar { display: none; }
.card-item { flex-shrink: 0; width: 150px; cursor: pointer; }
.card-art { width: 150px; height: 150px; border-radius: 16px; background: var(--glass-bg); border: 1px solid var(--glass-border); overflow: hidden; position: relative; box-shadow: var(--glass-shadow); margin-bottom: 10px; }
.card-art img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
.card-item:hover .card-art img { transform: scale(1.05); }
.card-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

/* Grille de Recherche (Browse by Genre) */
.genre-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.genre-card { height: 100px; border-radius: 16px; padding: 16px; display: flex; align-items: flex-start; justify-content: flex-start; font-size: 18px; font-weight: 800; position: relative; overflow: hidden; cursor: pointer; box-shadow: var(--glass-shadow); }
.genre-card::after { content: ''; position: absolute; right: -10px; bottom: -10px; width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 12px; transform: rotate(25deg); }

/* Barre de recherche */
.search-bar { display: flex; align-items: center; gap: 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); border-radius: 14px; padding: 0 16px; height: 50px; margin-bottom: 24px; }
.search-bar input { background: none; border: none; outline: none; color: #fff; font-size: 16px; width: 100%; font-family: inherit; font-weight: 500; }
.search-bar input::placeholder { color: var(--text-secondary); }

/* ============================================================
   MINI PLAYER
   ============================================================ */
.player {
  position: fixed; left: 16px; right: 16px; bottom: calc(90px + var(--sa-bottom));
  z-index: 140; display: none; align-items: center; gap: 12px;
  padding: 10px 14px; background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  border-radius: var(--radius); box-shadow: var(--glass-shadow);
  transform: translateY(20px); opacity: 0; transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.player.visible { display: flex; transform: translateY(0); opacity: 1; }
.player-art { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.player-art img { width: 100%; height: 100%; object-fit: cover; }
.player-info { flex: 1; min-width: 0; }
.player-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-artist { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-controls { display: flex; gap: 8px; align-items: center; }
.pc-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; }
.pc-btn.play { width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%; }
.pc-btn svg { width: 20px; height: 20px; }
.progress-mini { position: absolute; bottom: 0; left: 10px; right: 10px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
.progress-mini-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }

/* ============================================================
   LECTEUR PLEIN ÉCRAN
   ============================================================ */
.fp { position: fixed; inset: 0; background: #000; z-index: 300; display: flex; flex-direction: column; padding: calc(16px + var(--sa-top)) 24px calc(24px + var(--sa-bottom)); transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.2,0.9,0.3,1); overflow: hidden; visibility: hidden; }
.fp.open { transform: translateY(0); visibility: visible; }
.fp-bg { position: absolute; inset: -20%; z-index: 0; background-size: cover; background-position: center; filter: blur(80px) opacity(0.4); transition: background-image 0.5s ease; pointer-events: none; }
.fp-head { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; flex-shrink: 0; }
.fp-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; position: relative; z-index: 1; min-height: 0; }
.fp-media-container { width: 100%; display: flex; justify-content: center; }
.fp-art { width: min(80vw, 340px); height: min(80vw, 340px); border-radius: 24px; background: var(--glass-bg); box-shadow: var(--glass-shadow); overflow: hidden; position: relative; }
.fp-art img { width: 100%; height: 100%; object-fit: cover; }
.fp-video-wrap { width: 100%; max-width: 560px; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; background: #000; display: none; box-shadow: var(--glass-shadow); }
.fp.show-video .fp-art { display: none; }
.fp.show-video .fp-video-wrap { display: block; }
#ytHidden { position: fixed; top: 0; left: 0; width: 200px; height: 112px; opacity: 0.01; pointer-events: none; z-index: 1; }
#ytHidden.as-video { top: 50%!important; left: 50%!important; width: min(90vw,560px)!important; height: auto!important; aspect-ratio: 16/9; opacity: 1; pointer-events: auto; transform: translate(-50%,-50%); z-index: 310; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
#ytHidden iframe, #ytHidden > div { width:100%!important; height:100%!important; border:0!important; display:block!important; }

.fp-info { text-align: center; width: 100%; max-width: 520px; }
.fp-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-artist { font-size: 16px; color: var(--text-secondary); }
.fp-progress { width: 100%; max-width: 520px; margin-top: 10px; }
.progress-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; cursor: pointer; position: relative; }
.progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
.time-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
.fp-controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 10px; }
.fp-ctl { width: 50px; height: 50px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.fp-ctl.play { width: 72px; height: 72px; background: #fff; color: #000; border: none; box-shadow: 0 0 20px rgba(255,255,255,0.3); }
.fp-ctl.play svg { width: 32px; height: 32px; margin-left: 4px; }
.fp-ctl svg { width: 24px; height: 24px; }

/* ============================================================
   MODALES (Ajout, Options, etc.)
   ============================================================ */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; align-items: flex-end; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.modal.open { opacity: 1; pointer-events: auto; }
.modal-card { width: 100%; max-width: 620px; background: rgba(30,30,30,0.8); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-bottom: none; border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 24px 20px calc(40px + var(--sa-bottom)); transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.2,0.9,0.3,1); max-height: 85vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
.modal.open .modal-card { transform: translateY(0); }
.modal-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 20px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-head h3 { font-size: 20px; font-weight: 800; }
.modal-close { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }

/* Inputs & Boutons Modales */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; }
.field input { width: 100%; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); padding: 0 16px; color: #fff; font-size: 16px; outline: none; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; height: 50px; border-radius: 14px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.btn.primary { background: #fff; color: #000; }
.btn.ghost { background: rgba(255,255,255,0.1); color: #fff; }
.btn.danger { background: rgba(255,69,58,0.15); color: var(--danger); }

/* Playlist Picker */
.picker-card { background: rgba(30,30,30,0.9); border-radius: 24px; padding: 24px; width: 100%; max-width: 400px; border: 1px solid var(--glass-border); }
.picker-item { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.05); margin-bottom: 8px; cursor: pointer; font-weight: 600; }
.picker-item:hover { background: rgba(255,255,255,0.15); }

/* Toasts */
.toast { position: fixed; bottom: calc(140px + var(--sa-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(255,255,255,0.9); color: #000; padding: 12px 24px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.2,0.9,0.3,1); z-index: 400; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Styles spécifiques à la bibliothèque */
.entry-row { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; background: var(--glass-bg); border: 1px solid var(--glass-border); margin-bottom: 10px; cursor: pointer; box-shadow: var(--glass-shadow); transition: 0.2s; }
.entry-row:hover { background: var(--glass-bg-hover); transform: translateY(-2px); }
.entry-icon { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: #000; }
.entry-icon img { width: 100%; height: 100%; object-fit: cover; }
.entry-info { flex: 1; min-width: 0; }
.entry-info .t { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-info .s { font-size: 13px; color: var(--text-secondary); }

/* Icônes SVG inline */
svg.icon { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>

<div class="app">
  <header class="header">

  </div>
  <div class="fp-progress">
    <div class="progress-bar" id="fpProgressBar"><div class="progress-fill" id="fpProgressFill"></div></div>
    <div class="time-row"><span id="fpCur">0:00</span><span id="fpDur">0:00</span></div>
  </div>
  <div class="fp-controls">

    <button class="fp-ctl play" data-act="toggle" id="fpPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="fp-ctl" data-act="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l10 7-10 7V5zM18 5v14h-2V5h2z"/></svg></button>
  </div>
</div>

<!-- MODALES (Ajout, etc.) -->
<div class="modal" id="importModal">
  <div class="modal-card">
    <div class="modal-handle"></div>
    <div class="modal-head"><h3>Ajouter de la musique</h3><button class="modal-close" onclick="document.getElementById('importModal').classList.remove('open')">✕</button></div>
    <div class="drop-zone" id="dropZone" style="border: 2px dashed rgba(255,255,255,0.2); border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:40px;height:40px;margin-bottom:12px;opacity:0.6;"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      <div style="font-size:16px;font-weight:600;margin-bottom:4px;">Choisir des fichiers</div>
      <div style="font-size:13px;color:var(--text-secondary);">MP3, WAV, FLAC, M4A…</div>

    <input type="file" id="fileInput" accept="audio/*" multiple style="display:none">
  </div>
</div>

<div class="modal" id="editTrackModal">
  <div class="modal-card">
    <div class="modal-handle"></div>
    <div class="modal-head"><h3>Modifier</h3><button class="modal-close" onclick="document.getElementById('editTrackModal').classList.remove('open')">✕</button></div>
    <div class="field"><label>Titre</label><input type="text" id="etTitle"></div>

<div class="modal" id="playlistPicker" style="align-items:center;">
  <div class="picker-card">
    <h4 style="margin-bottom:16px;font-size:18px;">Ajouter à…</h4>
    <div id="pickerList"></div>
    <div style="display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;border:2px dashed rgba(255,255,255,0.2);margin-top:8px;">
      <input id="newPlName" placeholder="Nouvelle playlist…" style="background:none;border:none;outline:none;color:#fff;font-size:16px;width:100%;">
    </div>
  </div>
</div>

<!-- Le lecteur caché de YouTube -->
<div id="ytHidden"><div id="ytPlayer"></div></div>
<div class="toast" id="toast"></div>

<script>
window.onerror = function(msg, url, line, col, error) {
  var errDiv = document.getElementById('globalError');
  if(errDiv) { errDiv.style.display = 'block'; errDiv.textContent = 'Erreur JS: ' + msg + ' (Ligne ' + line + ')'; }
  return false;
};

(function(){
'use strict';

// --- UTILS & STORAGE ---
function $(s){return document.querySelector(s);}
function $$(s){return document.querySelectorAll(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(s){if(!isFinite(s)||s<0)s=0;var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x;}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function unescapeHtml(str){ if(!str) return ''; return str.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>'); }
function cleanTitle(t){ if(!t)return ''; var r=t.replace(/\s*[\(\[]\s*(clip\s*officiel|official\s*(music\s*)?video|official\s*audio|lyric\s*video|lyrics?|audio\s*only|audio|hd|hq|4k|mv|m\/v)\s*[\)\]]/gi,'').replace(/\s*[\(\[]\s*(clip|video|vidéo)\s*(officiel|officielle|official)?\s*[\)\]]/gi,'').replace(/\s{2,}/g,' ').trim(); return unescapeHtml(r||t); }

var DB=(function(){ var p=null; function open(){ if(p)return p; p=new Promise(function(res,rej){ var r=indexedDB.open('2am-db',2); r.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files');}; r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);}; }); return p; } return { put:function(s,k,v){return open().then(function(db){return new Promise(function(res,rej){var t=db.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error);};});});}, get:function(s,k){return open().then(function(db){return new Promise(function(res,rej){var t=db.transaction(s,'readonly');var r=t.objectStore(s).get(k);r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});});}, del:function(s,k){return open().then(function(db){return new Promise(function(res,rej){var t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=res;t.onerror=function(){rej(t.error);};});});} }; })();

var S = {
  tracks:[], playlists:[], liked:[], history:[],
  cur:-1, playing:false, queue:null, context:null,
  pendingTrack:null, fullscreenOpen:false, showVideo:false,
  view:'home', trending:[], recs:[], colorCache:{}
};
var LS='2am:v6';
var audio = new Audio(); audio.preload='metadata';

function save(){
  var data = {
    tracks: S.tracks.filter(t=>!t._temp).map(t=>({id:t.id,title:t.title,artist:t.artist,type:t.type,src:t.type==='file'?null:t.src,ytId:t.ytId,thumb:t.thumb,duration:t.duration||0})),
    playlists: S.playlists, liked: S.liked, history: S.history.filter(t=>!t._temp).slice(0,20)
  };
  try{localStorage.setItem(LS,JSON.stringify(data));}catch(e){}
}
function restore(){
  var d=null;try{d=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
  if(!d)return Promise.resolve();
  S.playlists=d.playlists||[]; S.liked=d.liked||[]; S.history=d.history||[];
  var p = (d.tracks||[]).map(m=>{
    if(m.type!=='file'){S.tracks.push(m); return Promise.resolve();}
    return DB.get('files',m.id).then(b=>{ if(!b)return; m.src=URL.createObjectURL(b); S.tracks.push(m); }).catch(()=>{});
  });
  return Promise.all(p);
}

// --- API YOUTUBE ---
function fetchOnline(params){
  var qs=new URLSearchParams(params).toString();
  return fetch('/api/youtube?'+qs).then(r=>{
    if(!r.ok) return r.json().catch(()=>({})).then(e=>{ throw new Error(e.error || 'Erreur API ('+r.status+')'); });
    return r.json();
  });
}
function normalize(item){
  var id=typeof item.id==='string'?item.id:(item.id&&item.id.videoId);
  if(!id)return null;
  var t=item.snippet.thumbnails||{};
  var thumb=(t.maxres||t.standard||t.high||t.medium||t.default||{}).url||'';
  return {ytId:id, title:cleanTitle(item.snippet.title), channel:unescapeHtml(item.snippet.channelTitle), thumb:thumb};
}
function searchOnline(q){ return fetchOnline({q:q}).then(d=>(d.items||[]).map(normalize).filter(Boolean)); }
function loadTrending(){ var r='FR'; return fetchOnline({region:r}).then(d=>(d.items||[]).map(normalize).filter(Boolean)); }

// --- YT PLAYER (Caché) ---
var ytPlayer=null, ytReady=false, ytPending=null, ytTimer=null;
window.onYouTubeIframeAPIReady=function(){
  try{
    ytPlayer = new YT.Player('ytPlayer', { height:'225', width:'400',
      playerVars:{autoplay:1, controls:0, disablekb:1, fs:0, modestbranding:1, rel:0, playsinline:1, origin:location.origin},
      events:{
        onReady:()=>{ ytReady=true; if(ytPending){ ytLoad(ytPending); ytPending=null; } },
        onStateChange:(e)=>{
          if(e.data===YT.PlayerState.ENDED) nextTrack();
          else if(e.data===YT.PlayerState.PLAYING){ S.playing=true; updatePlayIcons(); startPoll(); }
          else if(e.data===YT.PlayerState.PAUSED){ S.playing=false; updatePlayIcons(); }
        },
        onError:()=>{ toast('Erreur de lecture'); nextTrack(); }
      }
    });
  }catch(e){}
};
function loadYTAPI(){ if(window.YT&&window.YT.Player){ window.onYouTubeIframeAPIReady(); return; } var tag=document.createElement('script'); tag.src='https://www.youtube.com/iframe_api'; document.head.appendChild(tag); }
function ytLoad(videoId){
  if(!ytReady || !ytPlayer){ ytPending=videoId; return; }
  try{ ytPlayer.loadVideoById(videoId); ytPlayer.setVolume(100); ytPlayer.playVideo(); }catch(e){}
}

// --- LOGIQUE DE LECTEUR ---
function getPool(){ return S.queue ? S.queue.map(id=>S.tracks.find(t=>t.id===id)).filter(Boolean) : S.tracks.filter(t=>!t._temp); }

function playTrack(item, opts={}){
  var idx = typeof item === 'number' ? item : S.tracks.indexOf(item);
  if(idx < 0 || idx >= S.tracks.length) return;
  S.cur = idx; var t = S.tracks[idx];
  if(opts.queue !== undefined) S.queue = opts.queue;
  if(opts.context !== undefined) S.context = opts.context;
  
  S.history = S.history.filter(x=>x.id !== t.id);
  S.history.unshift(t);
  if(S.history.length > 20) S.history.pop();
  save();

  if(t.type === 'yt'){
    try{ audio.pause(); audio.removeAttribute('src'); audio.load(); }catch(e){}
    ytLoad(t.ytId); S.playing = true; updatePlayIcons();
  } else {
    audio.src = t.src;
    audio.play().then(()=>{ S.playing = true; updatePlayIcons(); }).catch(()=>{ toast('Lecture bloquée'); });
  }

  renderPlayer();
  openFullscreen();
  renderView(); // Mettre à jour l'UI (historique, etc)
}

function togglePlay(){
  if(S.cur < 0) { if(S.tracks.length) playTrack(0); return; }
  var t = S.tracks[S.cur];
  if(t.type === 'yt'){
    if(!ytPlayer) return;
    var st = ytPlayer.getPlayerState();
    if(st === 1){ ytPlayer.pauseVideo(); S.playing = false; }
    else { ytPlayer.playVideo(); S.playing = true; }
  } else {
    if(audio.paused) { audio.play().then(()=>{ S.playing = true; updatePlayIcons(); }); }
    else { audio.pause(); S.playing = false; }
  }
  updatePlayIcons();
}

function nextTrack(){
  var pool = getPool();
  var idx = pool.indexOf(S.tracks[S.cur]);
  if(idx < pool.length - 1) playTrack(pool[idx+1], { queue: S.queue, context: S.context });
  else playTrack(pool[0], { queue: S.queue, context: S.context });
}
function prevTrack(){
  var pool = getPool();
  var idx = pool.indexOf(S.tracks[S.cur]);
  if(idx > 0) playTrack(pool[idx-1], { queue: S.queue, context: S.context });
}

function startPoll(){
  clearInterval(ytTimer);
  ytTimer = setInterval(()=>{
    if(!ytPlayer || !ytPlayer.getCurrentTime) return;
    var c = ytPlayer.getCurrentTime() || 0;
    var d = ytPlayer.getDuration() || 1;
    var pct = (c/d)*100;
    $('#mpProgress').style.width = pct+'%';
    $('#fpProgressFill').style.width = pct+'%';
    $('#fpCur').textContent = fmt(c);
    $('#fpDur').textContent = fmt(d);
  }, 500);
}

audio.addEventListener('timeupdate', ()=>{
  var c = audio.currentTime || 0;
  var d = audio.duration || 1;
  var pct = (c/d)*100;
  $('#mpProgress').style.width = pct+'%';
  $('#fpProgressFill').style.width = pct+'%';
  $('#fpCur').textContent = fmt(c);
  $('#fpDur').textContent = fmt(d);
});
audio.addEventListener('ended', nextTrack);

function updatePlayIcons(){
  var icon = S.playing ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>' : '<path d="M8 5v14l11-7z"/>';
  $('#mpPlay').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${icon}</svg>`;
  $('#fpPlay').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${icon}</svg>`;
  $('#miniPlayer').classList.toggle('visible', S.cur >= 0);
}

function renderPlayer(){
  var t = S.tracks[S.cur];
  if(!t) return;
  $('#mpTitle').textContent = t.title;
  $('#mpArtist').textContent = t.artist;
  $('#mpArt').innerHTML = t.thumb ? `<img src="${esc(t.thumb)}">` : '';
  $('#fpTitle').textContent = t.title;
  $('#fpArtist').textContent = t.artist;
  $('#fpCover').src = t.thumb || '';
  $('#fpBg').style.backgroundImage = `url('${t.thumb}')`;
}

function openFullscreen(){
  S.fullscreenOpen = true;
  $('#fullPlayer').classList.add('open');
  $('#miniPlayer').style.display = 'none';
}
function closeFullscreen(){
  S.fullscreenOpen = false;
  $('#fullPlayer').classList.remove('open');
  if(S.cur >= 0) $('#miniPlayer').style.display = 'flex';
}

// --- RENDU DES VUES (HTML GENERATION) ---

function renderView(){
  var el = $('#mainContent');
  if(S.view === 'home') renderHome(el);
  else if(S.view === 'library') renderLibrary(el);
  else if(S.view === 'discover') renderDiscover(el);
  else if(S.view === 'search') renderSearch(el);
}

function renderHome(el){
  var html = `
    <div class="section">
      <div class="section-title">For You</div>
    </div>
    
    <div class="section">
      <div class="section-header"><div class="section-title small">Songs You'll Love</div></div>
      <div class="track-list" id="homeRecent"></div>
    </div>

    <div class="section">
      <div class="section-header"><div class="section-title small">Recommended for You</div></div>
      <div class="carousel" id="homeRecs"></div>
    </div>

    <div class="section">
      <div class="section-header"><div class="section-title small">Trending Charts</div></div>
      <div class="carousel" id="homeTrending"></div>
    </div>
  `;
  el.innerHTML = html;

  // Historique (Songs You'll Love)
  var hRecent = $('#homeRecent');
  var recent = S.history.slice(0, 4);
  if(recent.length === 0) {
    hRecent.innerHTML = `<div style="color:var(--text-secondary);font-size:14px;">Aucune écoute récente</div>`;
  } else {
    hRecent.innerHTML = recent.map(t => {
      var idx = S.tracks.indexOf(t);
      return `
        <div class="track-row" onclick="playTrack(${idx})">
          <div class="track-art"><img src="${esc(t.thumb)}"></div>
          <div class="track-info">
            <div class="track-title">${esc(t.title)}</div>
            <div class="track-artist">${esc(t.artist)}</div>
          </div>
          <div class="track-more">•••</div>
        </div>
      `;
    }).join('');
  }

  // Recommandations (Carrousel)
  var hRecs = $('#homeRecs');
  if(S.recs.length === 0){
    // Fake recs basées sur le trending si vide
    S.recs = S.trending.slice(0, 5);
  }
  hRecs.innerHTML = S.recs.map(t => `
    <div class="card-item" onclick="alert('Lecture : ${esc(t.title)}')">
      <div class="card-art"><img src="${esc(t.thumb)}"></div>
      <div class="card-title">${esc(t.title)}</div>
      <div class="card-sub">${esc(t.channel || 'Artiste')}</div>
    </div>
  `).join('');

  // Tendances (Carrousel)
  var hTrend = $('#homeTrending');
  if(S.trending.length === 0){
    loadTrending().then(list => {
      S.trending = list;
      renderView();
    });
  }
  hTrend.innerHTML = S.trending.slice(0, 10).map(t => `
    <div class="card-item">
      <div class="card-art"><img src="${esc(t.thumb)}"></div>
      <div class="card-title">${esc(t.title)}</div>
      <div class="card-sub">${esc(t.channel)}</div>
    </div>
  `).join('');
}

function renderLibrary(el){
  var html = `
    <div class="section-header" style="margin-bottom:24px;">
      <div class="section-title">Your Library</div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" id="libAddBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="section-title small">Playlists</div></div>
      <div class="carousel" id="libPlaylists"></div>
    </div>

    <div class="section">
      <div class="section-header"><div class="section-title small">Songs</div></div>
      <div class="track-list" id="libSongs"></div>
    </div>
  `;
  el.innerHTML = html;

  $('#libAddBtn').onclick = () => $('#importModal').classList.add('open');

  // Playlists
  var pList = $('#libPlaylists');
  var plHtml = `
    <div class="card-item" onclick="alert('Titres aimés')">
      <div class="card-art" style="background:linear-gradient(135deg,#6A82FB,#FC5C7D);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" style="width:40px;height:40px;fill:#fff;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <div class="card-title">Titres aimés</div>
      <div class="card-sub">${S.liked.length} sons</div>
    </div>
  `;
  S.playlists.forEach(p => {
    var cover = p.trackIds.length ? S.tracks.find(t=>t.id===p.trackIds[0])?.thumb : null;
    plHtml += `
      <div class="card-item">
        <div class="card-art">${cover ? `<img src="${esc(cover)}">` : '<div style="width:100%;height:100%;background:#333;"></div>'}</div>
        <div class="card-title">${esc(p.name)}</div>
        <div class="card-sub">${p.trackIds.length} sons</div>
      </div>
    `;
  });
  pList.innerHTML = plHtml;

  // Songs
  var lSongs = $('#libSongs');
  var allSongs = S.tracks.filter(t=>!t._temp).slice(0, 10);
  lSongs.innerHTML = allSongs.map(t => `
    <div class="track-row" onclick="playTrack(${S.tracks.indexOf(t)})">
      <div class="track-art"><img src="${esc(t.thumb)}"></div>
      <div class="track-info">
        <div class="track-title">${esc(t.title)}</div>
        <div class="track-artist">${esc(t.artist)}</div>
      </div>
      <div class="track-more">•••</div>
    </div>
  `).join('');
}

function renderDiscover(el){
  el.innerHTML = `<div class="section-title">Discover</div><div style="color:var(--text-secondary);margin-top:20px;">Contenu à venir...</div>`;
}

function renderSearch(el){
  var html = `
    <div class="section-title" style="margin-bottom:20px;">Search</div>
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;color:var(--text-secondary);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search for songs, albums...">
    </div>
    
    <div class="section-title small" style="margin-bottom:16px;">Browse by Genre</div>
    <div class="genre-grid" id="genreGrid">
      <div class="genre-card" style="background:linear-gradient(45deg, #1DB954, #191414);">Pop</div>
      <div class="genre-card" style="background:linear-gradient(45deg, #FF0000, #000);">Hip-Hop</div>
      <div class="genre-card" style="background:linear-gradient(45deg, #8A2BE2, #4B0082);">R&B</div>
      <div class="genre-card" style="background:linear-gradient(45deg, #00FFFF, #0000FF);">Electronic</div>
      <div class="genre-card" style="background:linear-gradient(45deg, #FF8C00, #FF0000);">Rock</div>
      <div class="genre-card" style="background:linear-gradient(45deg, #32CD32, #006400);">Alternative</div>
    </div>

    <div id="searchResults" style="margin-top:30px;"></div>
  `;
  el.innerHTML = html;
  
  // Gérer la recherche
  var input = $('#searchInput');
  var timeout;
  input.oninput = () => {
    clearTimeout(timeout);
    var q = input.value.trim();
    if(!q) { $('#searchResults').innerHTML = ''; return; }
    timeout = setTimeout(() => {
      searchOnline(q).then(results => {
        $('#searchResults').innerHTML = results.map(r => `
          <div class="track-row" onclick="alert('Ajout de ${esc(r.title)}')">
            <div class="track-art"><img src="${esc(r.thumb)}"></div>
            <div class="track-info">
              <div class="track-title">${esc(r.title)}</div>
              <div class="track-artist">${esc(r.channel)}</div>
            </div>
          </div>
        `).join('');
      });
    }, 500);
  };
}

// --- INITIALISATION ---

$$('.nav-item').forEach(t => {
  t.onclick = () => {
    $$('.nav-item').forEach(n => n.classList.remove('active'));
    t.classList.add('active');
    S.view = t.dataset.view;
    renderView();
  };
});

$('#mpPlay').onclick = togglePlay;
$('#fpPlay').onclick = togglePlay;
$('#closeFullBtn').onclick = closeFullscreen;
$('#miniPlayer').onclick = (e) => { if(!e.target.closest('button')) openFullscreen(); };
$('#fpArt').onclick = () => {
  var t = S.tracks[S.cur];
  if(t && t.type === 'yt'){
    S.showVideo = !S.showVideo;
    $('#fullPlayer').classList.toggle('show-video', S.showVideo);
    $('#ytHidden').classList.toggle('as-video', S.showVideo);
  }
};

// Drop Zone
var dz = $('#dropZone');
dz.onclick = () => $('#fileInput').click();
$('#fileInput').onchange = (e) => {
  // Logique d'import simplifiée pour cet exemple
  alert('Import de ' + e.target.files.length + ' fichier(s)');
};

loadYTAPI();
restore().then(() => {
  renderView();
  updatePlayIcons();
});

// Exposer globalement pour les onclick HTML
window.playTrack = playTrack;
})();
</script>
</body>
</html>
