<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2AM - Musique Illimitée</title>
<link rel="icon" type="image/png" href="/IMG_0838.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LIQUID GLASS EXTREME
   ============================================================ */
:root {
  --bg-base: #05050a;
  --bg-gradient: radial-gradient(circle at 15% 15%, #3a1c71 0%, transparent 40%), radial-gradient(circle at 85% 85%, #d76d77 0%, transparent 40%), radial-gradient(circle at 50% 50%, #000000 0%, #05050a 100%);
  --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --danger: #ff453a;
  
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-bg-hover: rgba(255, 255, 255, 0.12);
  --glass-border: rgba(255, 255, 255, 0.25);
  --glass-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5), inset 0 -1px 2px rgba(255, 255, 255, 0.1), 0 8px 32px rgba(0, 0, 0, 0.6);
  --glass-blur: blur(40px) saturate(250%);
  
  --radius: 20px;
  --radius-lg: 32px;
  --sa-top: env(safe-area-inset-top, 0px);
  --sa-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:#000; }
body {
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  background: var(--bg-gradient);
  background-attachment: fixed;
}

/* LAYOUT */
.app { height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden; }
.header { display:flex; align-items:center; justify-content:space-between; padding: 16px 20px 10px; padding-top: calc(16px + var(--sa-top)); flex-shrink:0; gap:12px; z-index:10; }
.logo-clair { display: none; height:32px; }
.logo-sombre { display: block; height:32px; }
@media (prefers-color-scheme: light) { .logo-clair { display: block; } .logo-sombre { display: none; } }
.header-actions { display:flex; gap:10px; }
.icon-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow); color: var(--text); cursor:pointer; width: 44px; height: 44px; border-radius: 50%; display:flex; align-items:center; justify-content:center; transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1); }
.icon-btn:hover { background: var(--glass-bg-hover); transform: scale(1.05); }
.icon-btn:active { transform: scale(0.95); }
.icon-btn svg { width: 20px; height: 20px; }
.content { flex:1; overflow-y:auto; padding: 10px 20px 200px; min-height:0; position:relative; z-index:1; }
.content::-webkit-scrollbar { display: none; }
.section { margin-bottom: 32px; }
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
.section-title { font-size: 28px; font-weight: 900; letter-spacing: -1px; color: var(--text); line-height: 1.1; }
.section-title.small { font-size: 20px; letter-spacing: -0.5px; }

/* BOTTOM NAV */
.bottom-nav { position: fixed; bottom: calc(16px + var(--sa-bottom)); left: 16px; right: 16px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow); border-radius: var(--radius-lg); display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; z-index: 150; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-secondary); font-size: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; padding: 8px; border-radius: 16px; flex: 1; }
.nav-item.active { color: var(--text); background: rgba(255,255,255,0.1); }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }
.nav-add-btn { position: absolute; left: 50%; top: -15px; transform: translateX(-50%); width: 54px; height: 54px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow); display: flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer; transition: all 0.2s; z-index: 160; }
.nav-add-btn:active { transform: translateX(-50%) scale(0.9); }
.nav-add-btn svg { width: 28px; height: 28px; }
.nav-spacer { width: 54px; flex-shrink: 0; }

/* CARTES & LISTES */
.track-list { display: flex; flex-direction: column; gap: 12px; }
.track-row { display: flex; align-items: center; gap: 14px; cursor: pointer; padding: 8px; border-radius: 12px; transition: background 0.2s; }
.track-row:hover { background: var(--glass-bg); }
.track-art { width: 56px; height: 56px; border-radius: 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); overflow: hidden; flex-shrink: 0; }
.track-art img { width: 100%; height: 100%; object-fit: cover; }
.track-info { flex: 1; min-width: 0; }
.track-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-artist { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.track-more { color: var(--text-secondary); padding: 8px; font-size: 20px; font-weight: 900; line-height: 1; }
.carousel { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
.carousel::-webkit-scrollbar { display: none; }
.card-item { flex-shrink: 0; width: 150px; cursor: pointer; }
.card-art { width: 150px; height: 150px; border-radius: 16px; background: var(--glass-bg); border: 1px solid var(--glass-border); overflow: hidden; position: relative; box-shadow: var(--glass-shadow); margin-bottom: 10px; }
.card-art img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
.card-item:hover .card-art img { transform: scale(1.05); }
.card-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

/* SEARCH */
.genre-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.genre-card { height: 100px; border-radius: 16px; padding: 16px; display: flex; align-items: flex-start; justify-content: flex-start; font-size: 18px; font-weight: 800; position: relative; overflow: hidden; cursor: pointer; box-shadow: var(--glass-shadow); border: 1px solid var(--glass-border); }
.genre-card::after { content: ''; position: absolute; right: -10px; bottom: -10px; width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 12px; transform: rotate(25deg); }
.search-bar { display: flex; align-items: center; gap: 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); border-radius: 14px; padding: 0 16px; height: 50px; margin-bottom: 10px; }
.search-bar input { background: none; border: none; outline: none; color: #fff; font-size: 16px; width: 100%; font-family: inherit; font-weight: 500; }
.search-bar input::placeholder { color: var(--text-secondary); }

/* MINI PLAYER */
.player { position: fixed; left: 16px; right: 16px; bottom: calc(110px + var(--sa-bottom)); z-index: 140; display: none; align-items: center; gap: 12px; padding: 10px 14px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); border-radius: var(--radius); box-shadow: var(--glass-shadow); transform: translateY(20px); opacity: 0; transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); }
.player.visible { display: flex; transform: translateY(0); opacity: 1; }
.player-art { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.player-art img { width: 100%; height: 100%; object-fit: cover; }
.player-info { flex: 1; min-width: 0; }
.player-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-artist { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-controls { display: flex; gap: 8px; align-items: center; }
.pc-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; }
.pc-btn.play { width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%; }
.pc-btn svg { width: 20px; height: 20px; }
.progress-mini { position: absolute; bottom: 0; left: 10px; right: 10px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
.progress-mini-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }

/* LECTEUR PLEIN ÉCRAN */
.fp { position: fixed; inset: 0; background: #000; z-index: 300; display: flex; flex-direction: column; padding: calc(16px + var(--sa-top)) 24px calc(24px + var(--sa-bottom)); transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.2,0.9,0.3,1); overflow: hidden; visibility: hidden; }
.fp.open { transform: translateY(0); visibility: visible; }
.fp-bg { position: absolute; inset: -20%; z-index: 0; background-size: cover; background-position: center; filter: blur(80px) opacity(0.4); transition: background-image 0.5s ease; pointer-events: none; }
.fp-head { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; flex-shrink: 0; }
.fp-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; position: relative; z-index: 1; min-height: 0; }
.fp-media-container { width: 100%; display: flex; justify-content: center; }
.fp-art { width: min(80vw, 340px); height: min(80vw, 340px); border-radius: 24px; background: var(--glass-bg); box-shadow: var(--glass-shadow); overflow: hidden; position: relative; }
.fp-art img { width: 100%; height: 100%; object-fit: cover; }
#fpLogoOverlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 2; transition: opacity 1s ease-out; pointer-events: none; }
#fpLogoOverlay.fade-out { opacity: 0; }
.fp-info { text-align: center; width: 100%; max-width: 520px; }
.fp-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-artist { font-size: 16px; color: var(--text-secondary); }
.fp-progress { width: 100%; max-width: 520px; margin-top: 10px; }
.progress-bar { height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; position: relative; }
.progress-fill { height: 100%; background: #fff; width: 0%; border-radius: 3px; position: relative; }
.progress-fill::after { content: ''; position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
.time-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 8px; font-variant-numeric: tabular-nums; }
.fp-controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 10px; }
.fp-ctl { width: 50px; height: 50px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.fp-ctl.play { width: 72px; height: 72px; background: #fff; color: #000; border: none; box-shadow: 0 0 20px rgba(255,255,255,0.3); }
.fp-ctl.play svg { width: 32px; height: 32px; margin-left: 4px; }
.fp-ctl svg { width: 24px; height: 24px; }

/* MODALES */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px;}
.modal.open { opacity: 1; pointer-events: auto; }
.modal-card { width: 100%; max-width: 450px; background: rgba(25,25,25,0.98); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 24px; transform: scale(0.95); transition: transform 0.35s cubic-bezier(0.2,0.9,0.3,1); box-shadow: 0 10px 40px rgba(0,0,0,0.5); position: relative;}
.modal.open .modal-card { transform: scale(1); }
.modal-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; z-index: 10; transition: 0.2s;}
.modal-close:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg); }
.modal-head h3 { font-size: 20px; font-weight: 800; margin-bottom: 20px; padding-right: 30px;}
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; }
.field input { width: 100%; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); padding: 0 16px; color: #fff; font-size: 16px; outline: none; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; height: 50px; border-radius: 14px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.btn.primary { background: #fff; color: #000; }
.btn.ghost { background: rgba(255,255,255,0.1); color: #fff; }
.picker-card { background: rgba(25,25,25,0.98); border-radius: 24px; padding: 24px; width: 100%; max-width: 400px; border: 1px solid var(--glass-border); position: relative; }
.picker-item { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; background: rgba(255,255,255,0.05); margin-bottom: 10px; cursor: pointer; font-weight: 600; font-size: 16px; transition: 0.2s;}
.picker-item:hover { background: rgba(255,255,255,0.15); }
.picker-item svg { width: 24px; height: 24px; color: var(--text-secondary); }
.toast { position: fixed; bottom: calc(140px + var(--sa-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(255,255,255,0.95); color: #000; padding: 12px 24px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.playlist-header { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
.playlist-cover { width: 120px; height: 120px; border-radius: 12px; background: var(--glass-bg); border: 1px solid var(--glass-border); overflow: hidden; flex-shrink: 0; }
.playlist-cover img { width: 100%; height: 100%; object-fit: cover; }
.playlist-info h1 { font-size: 28px; font-weight: 900; margin-bottom: 4px; line-height: 1.1; }
.playlist-info p { color: var(--text-secondary); font-size: 14px; }
.playlist-actions { display: flex; gap: 12px; margin-bottom: 24px; }
.import-progress { margin-top: 16px; display: none; }
.import-progress.active { display: block; }
.progress-track { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.progress-fill-import { height: 100%; background: #fff; width: 0%; transition: width 0.2s; border-radius: 3px; }
</style>
</head>

<div class="app">
  <header class="header">
    <img src="/83651B24-FA07-4F10-A55D-C3C6122C8206.jpeg" alt="2AM" class="logo-clair" onerror="this.style.display='none'">

<script>
window.onerror = function(msg, url, line, col, error) { var errDiv = document.getElementById('globalError'); if(errDiv) { errDiv.style.display = 'block'; errDiv.textContent = 'Erreur JS: ' + msg + ' (Ligne ' + line + ')'; } return false; };
(function(){
'use strict';

// --- UTILS & STORAGE ---
function $(s){return document.querySelector(s);} function $$(s){return document.querySelectorAll(s);} function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});} function fmt(s){if(!isFinite(s)||s<0)s=0;var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x;} function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function unescapeHtml(str){ if(!str) return ''; return str.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>'); }
function cleanTitle(t){ if(!t)return ''; var r=t.replace(/\s*[\(\[]\s*(clip\s*officiel|official\s*(music\s*)?video|official\s*audio|lyric\s*video|lyrics?|audio\s*only|audio|hd|hq|4k|mv|m\/v)\s*[\)\]]/gi,'').replace(/\s*[\(\[]\s*(clip|video|vidéo)\s*(officiel|officielle|official)?\s*[\)\]]/gi,'').replace(/\s{2,}/g,' ').trim(); return unescapeHtml(r||t); }

var toastTimer; window.showToast = function(msg){ var el=$('#toastEl'); if(!el) return; el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.classList.remove('show');},2400); };

var DB=(function(){ var p=null; function open(){ if(p)return p; p=new Promise(function(res,rej){ var r=indexedDB.open('2am-db',2); r.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files');}; r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);}; }); return p; } return { put:function(s,k,v){return open().then(function(db){return new Promise(function(res,rej){var t=db.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error);};});});}, get:function(s,k){return open().then(function(db){return new Promise(function(res,rej){var t=db.transaction(s,'readonly');var r=t.objectStore(s).get(k);r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});});}, del:function(s,k){return open().then(function(db){return new Promise(function(res,rej){var t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=res;t.onerror=function(){rej(t.error);};});});} }; })();

var S = { tracks:[], playlists:[], liked:[], history:[], cur:-1, playing:false, queue:null, context:null, fullscreenOpen:false, view:'home', trending:[], recs:[], colorCache:{}, currentPlaylistId: null, discoverData: [] };
var LS='2am:jiosaavn-final';
var audio = new Audio(); audio.preload='metadata';

// --- APPEL API (JioSaavn via /api/music) ---
async function fetchOnline(action, params = {}) {
  try {
    const query = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(`/api/music?${query}`);
    if (!res.ok) throw new Error(`Erreur API: ${res.status}`);
    return res.json();
  } catch (e) { console.error("Erreur:", e); throw e; }
}
function searchOnline(q) { return fetchOnline('search', { q }).then(d => d.tracks || []); }

// --- LECTEUR AUDIO NATIF ---
window.playTrack = function(item, opts={}){
  var idx = typeof item === 'number' ? item : S.tracks.indexOf(item);
  if(idx < 0 || idx >= S.tracks.length) return;
  S.cur = idx; var t = S.tracks[idx];
  if(opts.queue !== undefined) S.queue = opts.queue;
  if(opts.context !== undefined) S.context = opts.context;
  
  S.history = S.history.filter(x=>x.id !== t.id);
  S.history.unshift(t);
  if(S.history.length > 20) S.history.pop();
  save();

  var logoOverlay = $('#fpLogoOverlay');
  logoOverlay.classList.remove('fade-out');
  setTimeout(()=>{ logoOverlay.classList.add('fade-out'); }, 1000);

  if(t.type === 'jiosaavn'){
    audio.src = t.stream_url;
  } else {
    audio.src = t.src;
  }
  
  audio.play().then(()=>{ 
    S.playing = true; updatePlayIcons(); 
  }).catch(()=>{ 
    window.showToast('Lecture bloquée par le navigateur'); 
  });

  renderPlayer();
  openFullscreen();
  if(S.view === 'home') renderHome($('#mainContent')); 
}

function togglePlay(){
  if(S.cur < 0) { if(S.tracks.length) playTrack(0); return; }
  if(audio.paused) { 
    audio.play().then(()=>{ S.playing = true; updatePlayIcons(); }); 
  } else { 
    audio.pause(); S.playing = false; 
    updatePlayIcons();
  }
}

function nextTrack(){
  var pool = getPool();
  var idx = pool.indexOf(S.tracks[S.cur]);
  if(idx < pool.length - 1) playTrack(pool[idx+1], { queue: S.queue, context: S.context });
  else playTrack(pool[0], { queue: S.queue, context: S.context });
}
function prevTrack(){
  var pool = getPool();
  var idx = pool.indexOf(S.tracks[S.cur]);
  if(idx > 0) playTrack(pool[idx-1], { queue: S.queue, context: S.context });
}

audio.addEventListener('timeupdate', ()=>{
  var c = audio.currentTime || 0;
  var d = audio.duration || 1;
  var pct = (c/d)*100;
  $('#mpProgress').style.width = pct+'%';
  $('#fpProgressFill').style.width = pct+'%';
  $('#fpCur').textContent = fmt(c);
  $('#fpDur').textContent = fmt(d);
});
audio.addEventListener('ended', nextTrack);
audio.addEventListener('play', ()=>{ S.playing = true; updatePlayIcons(); });
audio.addEventListener('pause', ()=>{ S.playing = false; updatePlayIcons(); });

function getPool(){ return S.queue ? S.queue.map(id=>S.tracks.find(t=>t.id===id)).filter(Boolean) : S.tracks.filter(t=>!t._temp); }
function updatePlayIcons(){ var icon = S.playing ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>' : '<path d="M8 5v14l11-7z"/>'; $('#mpPlay').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${icon}</svg>`; $('#fpPlayBtn').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${icon}</svg>`; $('#miniPlayer').classList.toggle('visible', S.cur >= 0); }
function renderPlayer(){ var t = S.tracks[S.cur]; if(!t) return; $('#mpTitle').textContent = t.title; $('#mpArtist').textContent = t.artist; $('#mpArt').innerHTML = t.thumb ? `<img src="${esc(t.thumb)}">` : ''; $('#fpTitle').textContent = t.title; $('#fpArtist').textContent = t.artist; $('#fpCover').src = t.thumb || ''; $('#fpBg').style.backgroundImage = `url('${t.thumb}')`; }
function openFullscreen(){ S.fullscreenOpen = true; $('#fullPlayer').classList.add('open'); $('#miniPlayer').style.display = 'none'; }
function closeFullscreen(){ S.fullscreenOpen = false; $('#fullPlayer').classList.remove('open'); if(S.cur >= 0) $('#miniPlayer').style.display = 'flex'; }

// --- RENDU DES VUES ---
function renderView(){ var el = $('#mainContent'); if(S.view === 'home') renderHome(el); else if(S.view === 'library') renderLibrary(el); else if(S.view === 'discover') renderDiscover(el); else if(S.view === 'search') renderSearch(el); else if(S.view === 'playlist') renderPlaylistDetail(el); }

function loadRecommendations() {
  if(S.history.length === 0 && S.liked.length === 0) { if(S.trending.length > 0) S.recs = S.trending.sort(() => 0.5 - Math.random()).slice(0, 6); return; }
  var seedTrack = S.history.length > 0 ? S.history[0] : S.tracks.find(t => S.liked.includes(t.id));
  if(!seedTrack) return;
  var seedArtist = seedTrack.artist || 'Musique';
  searchOnline(seedArtist).then(results => {
    var filtered = results.filter(r => !S.tracks.find(t => t.id === r.id));
    S.recs = filtered.sort(() => 0.5 - Math.random()).slice(0, 6);
    if(S.view === 'home') renderHome($('#mainContent'));
  }).catch(()=>{});
}

function renderHome(el){
  if(S.recs.length === 0) loadRecommendations();
  var html = `<div class="section"><div class="section-title">For You</div></div><div class="section"><div class="section-header"><div class="section-title small">Songs You'll Love</div></div><div class="track-list" id="homeRecent"></div></div><div class="section"><div class="section-header"><div class="section-title small">Recommended for You</div></div><div class="carousel" id="homeRecs"></div></div><div class="section"><div class="section-header"><div class="section-title small">Trending Charts</div></div><div class="carousel" id="homeTrending"></div></div>`;
  el.innerHTML = html;
  var hRecent = $('#homeRecent'); var recent = S.history.slice(0, 4);
  if(recent.length === 0) { hRecent.innerHTML = `<div style="color:var(--text-secondary);font-size:14px;">Aucune écoute récente. Lancez un son !</div>`; } else { hRecent.innerHTML = recent.map(t => { var idx = S.tracks.indexOf(t); return `<div class="track-row" onclick="playTrack(${idx})"><div class="track-art"><img src="${esc(t.thumb)}"></div><div class="track-info"><div class="track-title">${esc(t.title)}</div><div class="track-artist">${esc(t.artist)}</div></div><div class="track-more" onclick="event.stopPropagation(); window.openTrackOptions('${t.id}')">•••</div></div>`; }).join(''); }
  var hRecs = $('#homeRecs'); hRecs.innerHTML = S.recs.map(t => `<div class="card-item" onclick="window.playFromOnline('${t.id}', '${esc(t.title)}', '${esc(t.artist)}', '${esc(t.thumb)}', '${t.stream_url}')"><div class="card-art"><img src="${esc(t.thumb)}"></div><div class="card-title">${esc(t.title)}</div><div class="card-sub">${esc(t.artist)}</div></div>`).join('');
  var hTrend = $('#homeTrending');
  if(S.trending.length === 0){ searchOnline('Musique tendance').then(list => { S.trending = list.sort(() => 0.5 - Math.random()); renderView(); }).catch(()=>{}); }
  hTrend.innerHTML = S.trending.slice(0, 10).map(t => `<div class="card-item" onclick="window.playFromOnline('${t.id}', '${esc(t.title)}', '${esc(t.artist)}', '${esc(t.thumb)}', '${t.stream_url}')"><div class="card-art"><img src="${esc(t.thumb)}"></div><div class="card-title">${esc(t.title)}</div><div class="card-sub">${esc(t.artist)}</div></div>`).join('');
}

function renderDiscover(el){ if(S.discoverData.length === 0) { el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-secondary)">Chargement...</div>`; searchOnline('Nouveautés musique').then(res => { S.discoverData = res.sort(() => 0.5 - Math.random()).slice(0, 10); renderDiscover(el); }).catch(()=>{ el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--danger)">Erreur de connexion API.</div>`; }); return; } var html = `<div class="section-title" style="margin-bottom:20px;">Discover</div><div class="carousel">${S.discoverData.map(t => `<div class="card-item" onclick="window.playFromOnline('${t.id}', '${esc(t.title)}', '${esc(t.artist)}', '${esc(t.thumb)}', '${t.stream_url}')"><div class="card-art"><img src="${esc(t.thumb)}"></div><div class="card-title">${esc(t.title)}</div><div class="card-sub">${esc(t.artist)}</div></div>`).join('')}</div>`; el.innerHTML = html; }

function renderSearch(el){
  var html = `<div class="section-title" style="margin-bottom:20px;">Search</div><div class="search-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;color:var(--text-secondary);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input type="text" id="searchInput" placeholder="Search for songs..."></div><div id="searchResults" style="margin-top:20px; display:none;"></div><div id="browseContainer"><div class="section-title small" style="margin-bottom:16px; margin-top:24px;">Browse by Genre</div><div class="genre-grid"><div class="genre-card" style="background:linear-gradient(45deg, #1DB954, #191414);" onclick="window.searchGenre('Pop Hits')">Pop</div><div class="genre-card" style="background:linear-gradient(45deg, #FF0000, #000);" onclick="window.searchGenre('Rap FR')">Hip-Hop</div><div class="genre-card" style="background:linear-gradient(45deg, #8A2BE2, #4B0082);" onclick="window.searchGenre('R&B Soul')">R&B</div><div class="genre-card" style="background:linear-gradient(45deg, #00FFFF, #0000FF);" onclick="window.searchGenre('Electronic Dance')">Electronic</div><div class="genre-card" style="background:linear-gradient(45deg, #FF8C00, #FF0000);" onclick="window.searchGenre('Rock Classics')">Rock</div><div class="genre-card" style="background:linear-gradient(45deg, #32CD32, #006400);" onclick="window.searchGenre('Alternative Indie')">Alternative</div></div></div>`;
  el.innerHTML = html;
  var input = $('#searchInput'); var timeout;
  input.oninput = () => { clearTimeout(timeout); var q = input.value.trim(); if(!q) { $('#searchResults').style.display = 'none'; $('#browseContainer').style.display = 'block'; return; } $('#browseContainer').style.display = 'none'; $('#searchResults').style.display = 'block'; timeout = setTimeout(() => { $('#searchResults').innerHTML = `<div style="color:var(--text-secondary);text-align:center;padding:20px;">Recherche...</div>`; searchOnline(q).then(results => { if(results.length === 0) { $('#searchResults').innerHTML = `<div style="color:var(--text-secondary);text-align:center;padding:20px;">Aucun résultat.</div>`; return; } $('#searchResults').innerHTML = results.map(r => `<div class="track-row" onclick="window.playFromOnline('${r.id}', '${esc(r.title)}', '${esc(r.artist)}', '${esc(r.thumb)}', '${r.stream_url}')"><div class="track-art"><img src="${esc(r.thumb)}"></div><div class="track-info"><div class="track-title">${esc(r.title)}</div><div class="track-artist">${esc(r.artist)}</div></div><div class="track-more" onclick="event.stopPropagation(); window.addFromOnline('${r.id}', '${esc(r.title)}', '${esc(r.artist)}', '${esc(r.thumb)}', '${r.stream_url}')">＋</div></div>`).join(''); }).catch((err)=>{ $('#searchResults').innerHTML = `<div style="color:var(--danger);text-align:center;padding:20px;font-weight:600;">Erreur: ${err.message}</div>`; }); }, 600); };
}
window.searchGenre = function(genre) { var input = $('#searchInput'); if(input) { input.value = genre; input.dispatchEvent(new Event('input')); } };

function renderPlaylistDetail(el){ var isLiked = S.currentPlaylistId === 'liked'; var p = isLiked ? null : S.playlists.find(x => x.id === S.currentPlaylistId); if(!isLiked && !p) return; var title = isLiked ? 'Titres aimés' : p.name; var trackIds = isLiked ? S.liked : p.trackIds; var tracks = trackIds.map(id => S.tracks.find(t => t.id === id)).filter(Boolean); var cover = tracks.length > 0 ? tracks[0].thumb : null; var html = `<button class="icon-btn" style="margin-bottom:20px;" onclick="window.navTo('library')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button><div class="playlist-header"><div class="playlist-cover">${cover ? `<img src="${esc(cover)}">` : (isLiked ? '<div style="width:100%;height:100%;background:linear-gradient(135deg,#6A82FB,#FC5C7D)"></div>' : '<div style="width:100%;height:100%;background:#333;"></div>')}</div><div class="playlist-info"><h1>${esc(title)}</h1><p>${tracks.length} titres</p></div></div><div class="playlist-actions"><button class="btn primary" style="flex:0 0 auto; padding:0 24px;" onclick="window.playPlaylist('${S.currentPlaylistId}')"><svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;margin-right:8px;"><path d="M8 5v14l11-7z"/></svg> Lecture</button></div><div class="track-list">${tracks.map(t => `<div class="track-row" onclick="playTrack(${S.tracks.indexOf(t)}, {queue: ${JSON.stringify(trackIds)}, context: '${S.currentPlaylistId}'})"><div class="track-art"><img src="${esc(t.thumb)}"></div><div class="track-info"><div class="track-title">${esc(t.title)}</div><div class="track-artist">${esc(t.artist)}</div></div><div class="track-more" onclick="event.stopPropagation(); window.openTrackOptions('${t.id}')">•••</div></div>`).join('')}${tracks.length === 0 ? '<div style="color:var(--text-secondary);">Playlist vide</div>' : ''}</div>`; el.innerHTML = html; }
function renderLibrary(el){ var html = `<div class="section-header" style="margin-bottom:24px;"><div class="section-title">Your Library</div></div><div class="section"><div class="section-header"><div class="section-title small">Playlists</div></div><div class="carousel" id="libPlaylists"></div></div><div class="section"><div class="section-header"><div class="section-title small">Songs</div></div><div class="track-list" id="libSongs"></div></div>`; el.innerHTML = html; var pList = $('#libPlaylists'); var plHtml = `<div class="card-item" onclick="window.openPlaylist('liked')"><div class="card-art" style="background:linear-gradient(135deg,#6A82FB,#FC5C7D);display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" style="width:40px;height:40px;fill:#fff;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><div class="card-title">Titres aimés</div><div class="card-sub">${S.liked.length} sons</div></div>`; S.playlists.forEach(p => { var cover = p.trackIds.length ? S.tracks.find(t=>t.id===p.trackIds[0])?.thumb : null; plHtml += `<div class="card-item" onclick="window.openPlaylist('${p.id}')"><div class="card-art">${cover ? `<img src="${esc(cover)}">` : '<div style="width:100%;height:100%;background:#333;"></div>'}</div><div class="card-title">${esc(p.name)}</div><div class="card-sub">${p.trackIds.length} sons</div></div>`; }); pList.innerHTML = plHtml; var lSongs = $('#libSongs'); var allSongs = S.tracks.filter(t=>!t._temp).slice(0, 10); if(allSongs.length === 0) { lSongs.innerHTML = `<div style="color:var(--text-secondary);font-size:14px;">Aucun son dans la bibliothèque. Cliquez sur + pour en ajouter.</div>`; } else { lSongs.innerHTML = allSongs.map(t => `<div class="track-row" onclick="playTrack(${S.tracks.indexOf(t)})"><div class="track-art"><img src="${esc(t.thumb)}"></div><div class="track-info"><div class="track-title">${esc(t.title)}</div><div class="track-artist">${esc(t.artist)}</div></div><div class="track-more" onclick="event.stopPropagation(); window.openTrackOptions('${t.id}')">•••</div></div>`).join(''); } }

async function importFiles(files) { let count = 0; for (let file of files) { if (!file.type.startsWith('audio/')) continue; const id = uid(); await DB.put('files', id, file); const url = URL.createObjectURL(file); const name = file.name.replace(/\.[^/.]+$/, ""); const parts = name.split(' - '); const artist = parts.length > 1 ? parts[0] : 'Artiste inconnu'; const title = parts.length > 1 ? parts.slice(1).join(' - ') : name; S.tracks.push({ id, title, artist, type: 'file', src: url, duration: 0 }); count++; } save(); renderView(); window.showToast(`${count} fichier(s) importé(s)`); }
window.importSpotifyPlaylist = async function() { var url = $('#spotifyUrlInput').value.trim(); if(!url) return window.showToast('Collez un lien Spotify valide'); var prog = $('#spotifyProgress'); var fill = $('#spotifyProgressFill'); var text = $('#spotifyProgressText'); prog.classList.add('active'); fill.style.width = '5%'; text.textContent = 'Analyse de la playlist...'; try { let res = await fetch('/api/spotify?url=' + encodeURIComponent(url)); let data = await res.json(); if(!res.ok) throw new Error(data.error || 'Erreur serveur Spotify'); let plName = data.name || 'Playlist Spotify'; let tracks = data.tracks || []; if(tracks.length === 0) throw new Error('Aucune piste trouvée'); let newPl = S.playlists.find(p => p.name === plName); if(!newPl) { newPl = { id: uid(), name: plName, trackIds: [] }; S.playlists.push(newPl); } let added = 0; for (let i = 0; i < tracks.length; i++) { let t = tracks[i]; let q = `${t.artist} ${t.title}`; let pct = Math.round(((i + 1) / tracks.length) * 100); fill.style.width = pct + '%'; text.textContent = `Recherche : ${t.title}... (${i+1}/${tracks.length})`; try { let saavnResults = await searchOnline(q); if(saavnResults.length > 0) { let best = saavnResults[0]; let existing = S.tracks.find(x => x.id === best.id); if(!existing) { existing = { id: best.id, title: best.title, artist: best.artist, type: 'jiosaavn', thumb: best.thumb, stream_url: best.stream_url, duration: 0 }; S.tracks.push(existing); } if(newPl.trackIds.indexOf(existing.id) === -1) { newPl.trackIds.push(existing.id); added++; } } } catch(e) { console.warn('Echec pour:', q, e); } } save(); fill.style.width = '100%'; text.textContent = `✅ Terminé ! ${added} sons ajoutés.`; setTimeout(() => { $('#spotifyModal').classList.remove('open'); prog.classList.remove('active'); window.navTo('library'); }, 1500); } catch(err) { text.textContent = 'Erreur : ' + err.message; fill.style.background = 'var(--danger)'; } };
window.navTo = function(view) { S.view = view; $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view)); renderView(); };
window.openPlaylist = function(plId) { S.currentPlaylistId = plId; window.navTo('playlist'); };
window.playPlaylist = function(plId) { var p = plId === 'liked' ? { trackIds: S.liked } : S.playlists.find(x => x.id === plId); if(!p || p.trackIds.length === 0) return window.showToast('Playlist vide'); var tracks = p.trackIds.map(id => S.tracks.find(t => t.id === id)).filter(Boolean); if(tracks.length) playTrack(tracks[0], { queue: p.trackIds, context: plId }); };
window.playFromOnline = function(id, title, artist, thumb, stream_url) { var existing = S.tracks.find(t => t.id === id); if(!existing) { existing = { id, title, artist, type: 'jiosaavn', thumb, stream_url, duration: 0 }; S.tracks.push(existing); save(); } window.playTrack(existing); };
window.addFromOnline = function(id, title, artist, thumb, stream_url) { var existing = S.tracks.find(t => t.id === id); if(!existing) { existing = { id, title, artist, type: 'jiosaavn', thumb, stream_url, duration: 0 }; S.tracks.push(existing); save(); } window.currentPendingTrack = existing; openPickerModal(); };
window.openTrackOptions = function(trackId) { var t = S.tracks.find(x => x.id === trackId); if(!t) return; window.currentPendingTrack = t; $('#toTitle').textContent = t.title; var html = `<div class="picker-item" onclick="window.playPendingAndClose()"><svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;"><path d="M8 5v14l11-7z"/></svg><span>Écouter maintenant</span></div><div class="picker-item" onclick="window.addPendingToLiked()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span>Titres aimés</span></div><div class="picker-item" onclick="window.openPickerModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Ajouter à une playlist</span></div>`; $('#toList').innerHTML = html; $('#trackOptionsModal').classList.add('open'); };
window.playPendingAndClose = function() { var t = window.currentPendingTrack; if(t) window.playTrack(t); $('#trackOptionsModal').classList.remove('open'); };
window.addPendingToLiked = function() { var t = window.currentPendingTrack; if(t && S.liked.indexOf(t.id) === -1) { S.liked.push(t.id); save(); window.showToast('Ajouté aux titres aimés'); } $('#trackOptionsModal').classList.remove('open'); if(S.view === 'playlist' || S.view === 'library') renderView(); };
function openPickerModal() { var html = `<div class="picker-item" onclick="window.addPendingToLiked(); window.closePickerModal();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span>Titres aimés</span></div>`; S.playlists.forEach(p => { html += `<div class="picker-item" onclick="window.addPendingToPlaylist('${p.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>${esc(p.name)}</span></div>`; }); $('#pickerList').innerHTML = html; $('#trackOptionsModal').classList.remove('open'); $('#pickerModal').classList.add('open'); }
window.closePickerModal = function() { $('#pickerModal').classList.remove('open'); };
window.addPendingToPlaylist = function(plId) { var t = window.currentPendingTrack; var p = S.playlists.find(x => x.id === plId); if(t && p && p.trackIds.indexOf(t.id) === -1) { p.trackIds.push(t.id); save(); window.showToast('Ajouté à ' + p.name); } window.closePickerModal(); if(S.view === 'playlist') renderView(); };

$$('.modal').forEach(m => { m.addEventListener('click', (e) => { if(e.target === m) m.classList.remove('open'); }); });
$$('.nav-item').forEach(t => { t.onclick = () => window.navTo(t.dataset.view); });
$('#navAddBtn').onclick = () => { $('#addMenuModal').classList.add('open'); };
$('#mpPlay').onclick = (e) => { e.stopPropagation(); togglePlay(); };
$('#closeFullBtn').onclick = closeFullscreen;
$('#miniPlayer').onclick = (e) => { if(!e.target.closest('button')) openFullscreen(); };
$('#fpPlayBtn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
$('#fpPrevBtn').onclick = (e) => { e.stopPropagation(); prevTrack(); };
$('#fpNextBtn').onclick = (e) => { e.stopPropagation(); nextTrack(); };
$('#fpOptionsBtn').onclick = (e) => { e.stopPropagation(); if(S.cur >= 0) window.openTrackOptions(S.tracks[S.cur].id); };
$('#fpProgressBar').onclick = (e) => { var t = S.tracks[S.cur]; if(!t) return; var rect = e.currentTarget.getBoundingClientRect(); var pct = (e.clientX - rect.left) / rect.width; if (audio.duration) { audio.currentTime = audio.duration * pct; } };
$('#openSettingsBtn').onclick = () => { window.showToast('Paramètres bientôt disponibles'); };
$('#fileInput').onchange = (e) => { if(e.target.files.length > 0) { importFiles(e.target.files); e.target.value = ''; } };
$('#createPlBtn').onclick = () => { var name = $('#newPlNameInput').value.trim(); if(!name) return window.showToast('Entrez un nom'); S.playlists.push({ id: uid(), name: name, trackIds: [] }); save(); $('#newPlaylistModal').classList.remove('open'); $('#newPlNameInput').value = ''; window.showToast('Playlist créée'); renderView(); };

restore().then(() => { renderView(); updatePlayIcons(); });
})();
</script>
</body>
