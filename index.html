<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2AM</title>
<link rel="icon" type="image/jpeg" href="/B2C31374-D8AC-440D-B8EC-069045261502.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--dim:rgba(255,255,255,.55);--dim2:rgba(255,255,255,.32);--hover:rgba(255,255,255,.06);--active:rgba(255,255,255,.1)}
html,body{height:100%;overflow:hidden;background:#000}
body{color:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 90% 60% at 50% -15%,rgba(255,255,255,.07),transparent 70%)}
.app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0;gap:0}
#ytHidden{position:fixed;top:0;left:0;width:200px;height:200px;opacity:.001;pointer-events:none;z-index:-9999;overflow:hidden}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 8px;flex-shrink:0;gap:10px}
.logo{height:52px;width:auto;max-width:200px;display:block;object-fit:contain;filter:brightness(1.1)}
.header-actions{display:flex;align-items:center;gap:10px}
.icon-btn{background:transparent;border:none;color:#fff;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:22px;height:22px}

/* SEARCH */
.search-wrap{padding:0 22px 8px;flex-shrink:0;display:none}
.search-wrap.show{display:block}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.06);transition:.2s}
.search:focus-within{background:rgba(255,255,255,.1)}
.search svg{width:18px;height:18px;color:var(--dim2);flex-shrink:0}
.search input{background:none;border:none;outline:none;color:#fff;font-size:15px;width:100%;font-family:inherit}
.search input::placeholder{color:var(--dim2)}

/* TABS */
.tabs{display:flex;gap:8px;padding:0 22px 12px;flex-shrink:0}
.tab{padding:9px 22px;border-radius:999px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.tab:hover{color:#fff;background:var(--hover)}
.tab.active{background:#fff;color:#000}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:0 22px 30px;min-height:0}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:8px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-title:first-child{margin-top:4px}
.add-playlist-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;border:none}
.add-playlist-btn:hover{background:rgba(255,255,255,.16)}
.add-playlist-btn svg{width:16px;height:16px}

/* GRID (cards sans contours) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;margin-bottom:12px}
.card{cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px)}
.card-art{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:rgba(255,255,255,.2);overflow:hidden;position:relative}
.card-art img{width:100%;height:100%;object-fit:cover}
.card-title{font-size:14px;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12.5px;color:var(--dim2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-play{position:absolute;bottom:8px;right:8px;width:40px;height:40px;border-radius:50%;background:#fff;color:#000;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;transform:translateY(8px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card:hover .card-play{opacity:1;transform:translateY(0)}
.card-play:hover{transform:scale(1.08)}
.card-play svg{width:16px;height:16px;margin-left:2px}

/* LIKED ENTRY */
.liked-entry{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(91,75,255,.24),rgba(139,123,255,.06));cursor:pointer;transition:.15s;margin-bottom:20px;width:100%;text-align:left;color:#fff;font-family:inherit;border:none}
.liked-entry:hover{background:linear-gradient(135deg,rgba(91,75,255,.34),rgba(139,123,255,.12))}
.liked-icon{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#5B4BFF,#8B7BFF);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 18px rgba(91,75,255,.4)}
.liked-icon svg{width:26px;height:26px;fill:#fff}
.liked-info{flex:1;min-width:0}
.liked-info .t{font-size:16px;font-weight:700;letter-spacing:-.2px}
.liked-info .s{font-size:12.5px;color:rgba(255,255,255,.65);margin-top:3px}

/* TRACKS */
.track{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.12s;position:relative}
.track:hover{background:var(--hover)}
.track.active{background:var(--active)}
.track.dragging{opacity:.4}
.track.drag-over{box-shadow:inset 0 2px 0 #fff}
.track-art{width:46px;height:46px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:rgba(255,255,255,.35);overflow:hidden}
.track-art img{width:100%;height:100%;object-fit:cover}
.track-info{flex:1;min-width:0}
.track-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:12.5px;color:var(--dim2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-dur{font-size:12.5px;color:var(--dim2);flex-shrink:0;font-variant-numeric:tabular-nums}
.track-actions{display:flex;gap:4px;flex-shrink:0}
.track-action{opacity:0;width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--dim2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.track:hover .track-action{opacity:1}
.track-action:hover{background:rgba(255,255,255,.12);color:#fff}
.track-action.liked{opacity:1;color:#ff5577}
.track-action.liked svg{fill:#ff5577}
.drag-handle{cursor:grab;opacity:0;padding:0 4px;color:var(--dim2)}
.track:hover .drag-handle{opacity:1}

.empty{padding:50px 20px;text-align:center;color:var(--dim2)}
.empty svg{width:44px;height:44px;margin-bottom:14px;opacity:.3}
.empty-title{font-size:15px;font-weight:600;color:var(--dim);margin-bottom:4px}
.empty-sub{font-size:13px}

/* BOTTOM PLAYER (hidden by default, shown only when minimized) */
.player{
  height:76px;display:none;grid-template-columns:1fr minmax(240px,480px) 1fr;
  align-items:center;gap:18px;padding:0 22px;flex-shrink:0;
  background:rgba(20,20,20,.85);backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.06);
  transform:translateY(20px);opacity:0;transition:.3s cubic-bezier(.2,.9,.3,1);
}
.player.visible{display:grid;transform:translateY(0);opacity:1}
.player-left{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.player-art{width:48px;height:48px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:rgba(255,255,255,.35);overflow:hidden}
.player-art img{width:100%;height:100%;object-fit:cover}
.player-info{min-width:0}
.player-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-artist{font-size:12px;color:var(--dim2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-center{display:flex;flex-direction:column;gap:6px}
.controls{display:flex;align-items:center;justify-content:center;gap:4px}
.ctl{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;position:relative}
.ctl:hover{color:#fff;background:var(--hover)}
.ctl svg{width:18px;height:18px}
.ctl.active{color:#fff}
.ctl.active::after{content:'';position:absolute;bottom:2px;width:3px;height:3px;border-radius:50%;background:#fff}
.ctl.play{width:44px;height:44px;background:#fff;color:#000;margin:0 6px}
.ctl.play:hover{background:#f0f0f0;transform:scale(1.05)}
.ctl.play svg{width:18px;height:18px}
.progress-row{display:flex;align-items:center;gap:10px}
.time{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums;min-width:32px;text-align:center;flex-shrink:0}
.progress{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:2px;cursor:pointer;position:relative}
.progress::before{content:'';position:absolute;inset:-10px 0}
.progress-fill{height:100%;background:#fff;border-radius:2px;width:0%;position:relative}
.progress-fill::after{content:'';position:absolute;right:-5px;top:50%;width:10px;height:10px;background:#fff;border-radius:50%;transform:translateY(-50%) scale(0);transition:.15s}
.progress:hover .progress-fill::after{transform:translateY(-50%) scale(1)}
.player-right{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.volume{width:80px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;cursor:pointer;position:relative}
.volume::before{content:'';position:absolute;inset:-10px 0}
.volume-fill{height:100%;background:#fff;border-radius:2px;width:100%}

/* FULLSCREEN PLAYER */
.fp{
  position:fixed;inset:0;background:#000;z-index:300;
  display:flex;flex-direction:column;padding:20px 24px 32px;
  transform:translateY(100%);transition:.45s cubic-bezier(.2,.9,.3,1);
  overflow:hidden;visibility:hidden;
}
.fp.open{transform:translateY(0);visibility:visible}
.fp::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.1),transparent 55%);pointer-events:none}
.fp-head{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;flex-shrink:0}
.fp-tag{font-size:11px;color:var(--dim2);letter-spacing:1.8px;text-transform:uppercase;font-weight:600}
.fp-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;position:relative;z-index:1;min-height:0;padding:12px 0}
.fp-art{
  width:min(70vw,340px);height:min(70vw,340px);border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.02));
  box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:80px;font-weight:800;color:rgba(255,255,255,.2);
  transition:transform .3s;
}
.fp-art img{width:100%;height:100%;object-fit:cover}
.fp.playing .fp-art{animation:pulseArt 4s ease-in-out infinite}
@keyframes pulseArt{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.fp-info{text-align:center;width:100%;max-width:520px;padding:0 8px}
.fp-title-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.fp-title{font-size:24px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.fp-artist{font-size:14.5px;color:var(--dim)}
.fp-like{width:42px;height:42px;border-radius:50%;background:transparent;border:none;color:rgba(255,255,255,.55);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.fp-like:hover{background:var(--hover);color:#fff}
.fp-like svg{width:24px;height:24px;transition:.2s}
.fp-like.liked{color:#ff5577}
.fp-like.liked svg{fill:#ff5577;transform:scale(1.1)}
.fp-progress-wrap{width:100%;max-width:520px;margin-top:10px;position:relative;z-index:1}
.fp-progress-wrap .progress{height:5px}
.fp-time-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim2);margin-top:8px;font-variant-numeric:tabular-nums}
.fp-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:4px;position:relative;z-index:1}
.fp-ctl{width:52px;height:52px;border-radius:50%;border:none;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;position:relative}
.fp-ctl:hover{background:var(--hover)}
.fp-ctl svg{width:24px;height:24px}
.fp-ctl.active{color:#fff}
.fp-ctl.active::after{content:'';position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:#fff}
.fp-ctl.play{width:72px;height:72px;background:#fff;color:#000}
.fp-ctl.play:hover{transform:scale(1.05);background:#f0f0f0}
.fp-ctl.play svg{width:28px;height:28px}
.fp-ctl.small{width:44px;height:44px}
.fp-ctl.small svg{width:20px;height:20px}
.fp-foot{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;flex-shrink:0;margin-top:10px}
.fp-volume{display:flex;align-items:center;gap:10px;flex:1;max-width:180px}
.fp-volume svg{width:16px;height:16px;color:var(--dim2);flex-shrink:0}
.fp-volume-slider{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:2px;cursor:pointer;position:relative}
.fp-volume-slider::before{content:'';position:absolute;inset:-10px 0}
.fp-volume-fill{height:100%;background:#fff;border-radius:2px;width:100%}
.fp-ad-badge{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(255,80,80,.15);color:#ff7070;padding:5px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:1.2px;border:1px solid rgba(255,80,80,.3);z-index:10}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:.2s}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{width:100%;max-width:620px;background:rgba(20,20,20,.96);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.1);border-bottom:none;border-radius:26px 26px 0 0;padding:20px 20px 40px;transform:translateY(100%);transition:.3s cubic-bezier(.2,.9,.3,1);max-height:85vh;overflow-y:auto}
.modal.open .modal-card{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h3{font-size:18px;font-weight:700;letter-spacing:-.3px}
.modal-close{background:rgba(255,255,255,.08);border:none;color:#fff;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.15s}
.modal-close:hover{background:rgba(255,255,255,.16)}
.modal-close svg{width:16px;height:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--dim2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.field input[type=text]{width:100%;height:46px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:0 14px;color:#fff;font-size:14.5px;font-family:inherit;outline:none;transition:.15s}
.field input[type=text]:focus{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.1)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1;height:50px;border-radius:14px;border:none;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.modal-actions .btn.primary{background:#fff;color:#000}
.modal-actions .btn.primary:hover{background:#f0f0f0}
.modal-actions .btn.ghost{background:rgba(255,255,255,.08);color:#fff}
.modal-actions .btn.ghost:hover{background:rgba(255,255,255,.14)}
.modal-actions .btn.danger{background:rgba(255,80,80,.15);color:#ff7070}
.modal-actions .btn.danger:hover{background:rgba(255,80,80,.25)}

.drop-zone{border:1.5px dashed rgba(255,255,255,.18);border-radius:18px;padding:34px 20px;text-align:center;cursor:pointer;transition:.2s}
.drop-zone:hover,.drop-zone.over{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.03)}
.drop-zone svg{width:36px;height:36px;color:rgba(255,255,255,.4);margin-bottom:12px}
.drop-zone .t1{font-size:15px;font-weight:600;margin-bottom:4px}
.drop-zone .t2{font-size:13px;color:rgba(255,255,255,.4)}
.import-alt{width:100%;margin-top:14px;height:50px;border-radius:14px;background:rgba(255,255,255,.06);border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s}
.import-alt:hover{background:rgba(255,255,255,.12)}
.import-alt svg{width:18px;height:18px}

.search-result{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;cursor:pointer;transition:.12s}
.search-result:hover{background:var(--hover)}
.search-result-art{width:60px;height:60px;border-radius:8px;flex-shrink:0;overflow:hidden;background:rgba(255,255,255,.05)}
.search-result-art img{width:100%;height:100%;object-fit:cover}
.search-result-info{flex:1;min-width:0}
.search-result-title{font-size:13.5px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-result-channel{font-size:12px;color:var(--dim2);margin-top:3px}
.search-result-add{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s}
.search-result-add:hover{background:#fff;color:#000}
.search-result-add svg{width:16px;height:16px}
.search-msg{padding:30px 20px;text-align:center;color:rgba(255,255,255,.45);font-size:13.5px;line-height:1.5}

.playlist-picker{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:220;opacity:0;pointer-events:none;transition:.2s}
.playlist-picker.open{opacity:1;pointer-events:auto}
.picker-card{width:100%;max-width:400px;background:rgba(22,22,22,.97);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:22px;transform:scale(.95);transition:.25s;max-height:80vh;overflow-y:auto}
.playlist-picker.open .picker-card{transform:scale(1)}
.picker-card h4{font-size:17px;font-weight:700;margin-bottom:16px}
.picker-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.06);cursor:pointer;transition:.15s;margin-bottom:8px}
.picker-item:hover{background:rgba(255,255,255,.14)}
.picker-item svg{width:18px;height:18px;color:var(--dim2);flex-shrink:0}
.picker-item span{font-size:14px;font-weight:500}
.picker-new{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.18);cursor:text;transition:.15s;margin-top:8px}
.picker-new:hover{background:rgba(255,255,255,.05)}
.picker-new svg{width:18px;height:18px;color:var(--dim2);flex-shrink:0}
.picker-new input{background:none;border:none;outline:none;color:#fff;font-size:14px;font-family:inherit;width:100%}
.picker-new input::placeholder{color:var(--dim2)}

/* PLAYLIST DETAIL */
.pl-head{display:flex;gap:22px;align-items:flex-end;margin-bottom:24px;padding-top:6px}
.pl-cover{width:130px;height:130px;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;font-size:44px;flex-shrink:0;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pl-cover img{width:100%;height:100%;object-fit:cover}
.pl-info{flex:1;min-width:0;padding-bottom:6px}
.pl-info .kind{font-size:11px;letter-spacing:1.6px;color:var(--dim2);font-weight:600;text-transform:uppercase;margin-bottom:6px}
.pl-info h2{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.15;margin-bottom:6px;word-break:break-word}
.pl-info .meta{font-size:13px;color:var(--dim2)}
.pl-actions{display:flex;gap:12px;margin-bottom:22px;align-items:center}
.pl-play{height:52px;padding:0 28px;border-radius:999px;background:#fff;color:#000;border:none;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:.15s}
.pl-play:hover{transform:scale(1.03);background:#f0f0f0}
.pl-play svg{width:18px;height:18px}
.pl-play:disabled{opacity:.35;cursor:not-allowed;transform:none}
.pl-mini{height:52px;padding:0 22px;border-radius:999px;background:rgba(255,255,255,.08);border:none;color:#fff;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.pl-mini:hover{background:rgba(255,255,255,.14)}
.pl-mini svg{width:16px;height:16px}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(28,28,28,.96);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);color:#fff;padding:12px 24px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.28s;z-index:400;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:shim 1.4s infinite}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media (max-width:640px){
  .header{padding:12px 16px 6px}
  .logo{height:42px}
  .icon-btn{width:40px;height:40px}
  .tabs{padding:0 16px 10px}
  .tab{padding:8px 18px;font-size:13.5px}
  .content{padding:0 16px 30px}
  .player{grid-template-columns:1fr auto;height:auto;padding:10px 14px;gap:6px;row-gap:8px}
  .player-center{order:-1;grid-column:1/-1}
  .player-right{display:none}
  .player-left{grid-column:1;justify-content:flex-start}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 12px}
  .fp{padding:16px 18px 24px}
  .fp-title{font-size:20px}
  .fp-art{width:min(75vw,280px);height:min(75vw,280px);font-size:60px}
  .fp-ctl{width:46px;height:46px}
  .fp-ctl.play{width:64px;height:64px}
  .fp-ctl.play svg{width:24px;height:24px}
  .fp-controls{gap:12px}
  .pl-head{flex-direction:column;align-items:center;text-align:center;gap:14px}
  .pl-info{text-align:center;padding-bottom:0}
  .pl-info h2{font-size:22px}
  .pl-actions{justify-content:center}
  .pl-cover{width:150px;height:150px}
}

<script>
(() => {
'use strict';
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{if(!isFinite(s)||s<0)s=0;const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0');};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

/* ===== IndexedDB ===== */
const DB=(()=>{let p=null;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('2am-db',2);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files');if(!db.objectStoreNames.contains('thumbs'))db.createObjectStore('thumbs');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));return{
  async put(s,k,v){const db=await open();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async get(s,k){const db=await open();return new Promise((res,rej)=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async del(s,k){const db=await open();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
};})();

/* ===== State ===== */
const S={
  tracks:[],playlists:[],liked:[],
  cur:-1,playing:false,shuffle:false,repeat:0,vol:1,
  filter:'',pendingTrack:null,currentPlaylistId:null,
  adPlaying:false,editingTrackId:null,editingPlId:null,
  view:'home',queue:null,trending:[],trendingRegion:'',
  fullscreenOpen:false
};
const LS='2am:v6';
const audio=new Audio();audio.preload='metadata';

/* ===== Persist ===== */
function save(){
  const data={
    tracks:S.tracks.map(t=>({id:t.id,title:t.title,artist:t.artist,type:t.type,src:t.type==='file'?null:t.src,ytId:t.ytId,thumb:t.thumb,duration:t.duration||0})),
    playlists:S.playlists.map(p=>({id:p.id,name:p.name,trackIds:p.trackIds})),
    liked:S.liked
  };
  try{localStorage.setItem(LS,JSON.stringify(data));}catch(e){}
}
async function restore(){
  let d=null;try{d=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
  if(!d)return;
  S.playlists=d.playlists||[];
  S.liked=d.liked||[];
  for(const m of (d.tracks||[])){
    let src=m.src;
    if(m.type==='file'){try{const b=await DB.get('files',m.id);if(!b)continue;src=URL.createObjectURL(b);}catch(e){continue;}}
    S.tracks.push({...m,src});
  }
}

/* ===== Helpers ===== */
function parseName(name){
  const base=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const p=base.split(' - ');
  if(p.length>=2)return{artist:p[0].trim()||'Artiste inconnu',title:p.slice(1).join(' - ').trim()};
  return{artist:'Artiste inconnu',title:base||'Sans titre'};
}
function probeDuration(src){return new Promise(res=>{const a=new Audio();a.preload='metadata';a.src=src;let done=false;const f=d=>{if(!done){done=true;res(d||0);}};a.onloadedmetadata=()=>f(a.duration);a.onerror=()=>f(0);setTimeout(()=>f(0),8000);});}
function userRegion(){try{const lang=navigator.language||'fr-FR';const code=lang.split('-')[1];return (code||'FR').toUpperCase().slice(0,2);}catch(e){return 'FR';}}
function isLiked(id){return S.liked.includes(id);}

/* ===== Import ===== */
async function importFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|flac|m4a|aac|ogg|opus|wma|aiff|alac)$/i.test(f.name));
  if(!list.length){toast('Aucun fichier audio valide');return;}
  let added=0;
  for(const f of list){
    const id=uid();
    try{await DB.put('files',id,f);}catch(e){continue;}
    const {artist,title}=parseName(f.name);
    const track={id,title,artist,type:'file',src:URL.createObjectURL(f),duration:0};
    S.tracks.push(track);
    probeDuration(track.src).then(d=>{if(d){track.duration=d;save();}});
    added++;
  }
  save();renderCurrentView();
  toast(added+(added>1?' titres importés':' titre importé'));
  closeImport();
}

/* ===== Online search ===== */
async function fetchOnline(params){
  const qs=new URLSearchParams(params).toString();
  const r=await fetch('/api/youtube?'+qs);
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'Erreur API');}
  return await r.json();
}
function normalize(item){
  const id=typeof item.id==='string'?item.id:item.id?.videoId;
  if(!id)return null;
  return{ytId:id,title:item.snippet.title,channel:item.snippet.channelTitle,thumb:item.snippet.thumbnails?.medium?.url||item.snippet.thumbnails?.default?.url||''};
}
async function searchOnline(q){
  const d=await fetchOnline({q});
  return (d.items||[]).map(normalize).filter(Boolean);
}
async function loadTrending(){
  const region=userRegion();
  S.trendingRegion=region;
  const d=await fetchOnline({region});
  return (d.items||[]).map(normalize).filter(Boolean);
}

/* ===== Player core ===== */
let ytPlayer=null,ytReady=false,ytPending=null,ytPollTimer=null,adPollTimer=null;
window.onYouTubeIframeAPIReady=function(){
  ytPlayer=new YT.Player('ytPlayer',{height:'200',width:'200',playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,playsinline:1},
    events:{
      onReady:()=>{ytReady=true;if(ytPending){const id=ytPending;ytPending=null;ytLoad(id);}},
      onStateChange:e=>{
        if(e.data===YT.PlayerState.ENDED)next(true);
        else if(e.data===YT.PlayerState.PLAYING){S.playing=true;updatePlayIcon();startPoll();renderPlayer();}
        else if(e.data===YT.PlayerState.PAUSED){S.playing=false;updatePlayIcon();renderPlayer();}
        else if(e.data===YT.PlayerState.BUFFERING){startAdPoll();}
      },
      onError:()=>{toast('Lecture impossible');next(true);}
    }});
};
function loadYTAPI(){if(window.YT&&window.YT.Player){window.onYouTubeIframeAPIReady();return;}const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);}

/* ===== Media Session ===== */
function updateMediaSession(track){
  if(!('mediaSession' in navigator))return;
  if(!track){navigator.mediaSession.metadata=null;return;}
  const art=[];
  if(track.thumb&&track.thumb.startsWith('http'))art.push({src:track.thumb,sizes:'512x512',type:'image/jpeg'});
  try{navigator.mediaSession.metadata=new MediaMetadata({title:track.title,artist:track.artist,album:'2AM',artwork:art});}catch(e){}
  navigator.mediaSession.setActionHandler('play',()=>{if(!S.playing)toggle();});
  navigator.mediaSession.setActionHandler('pause',()=>{if(S.playing)toggle();});
  navigator.mediaSession.setActionHandler('nexttrack',()=>next(false));
  navigator.mediaSession.setActionHandler('previoustrack',()=>prev());
}
function updateMediaSessionState(){if('mediaSession' in navigator)navigator.mediaSession.playbackState=S.playing?'playing':'paused';}

/* ===== Playback ===== */
function play(idx,queue){
  if(idx<0||idx>=S.tracks.length)return;
  S.cur=idx;const t=S.tracks[idx];
  if(queue)S.queue=queue;
  S.adPlaying=false;updateAdUI();
  updateMediaSession(t);
  if(t.type==='yt'){
    audio.pause();audio.removeAttribute('src');audio.load();
    ytLoad(t.ytId);
    S.playing=true;updatePlayIcon();renderCurrentView();
  }else{
    if(ytPlayer&&ytPlayer.pauseVideo)try{ytPlayer.pauseVideo();}catch(e){}
    stopPoll();stopAdPoll();
    audio.src=t.src;audio.play().then(()=>{S.playing=true;updatePlayIcon();renderCurrentView();}).catch(()=>{S.playing=false;updatePlayIcon();renderCurrentView();toast('Lecture impossible');});
  }
  // Auto-open fullscreen
  openFullscreen();
  if(S.playing)$('#fp').classList.add('playing');
}

function toggle(){
  if(S.cur<0){if(S.tracks.length)play(0);return;}
  const t=S.tracks[S.cur];
  if(t.type==='yt'){
    if(!ytPlayer||!ytPlayer.getPlayerState)return;
    const st=ytPlayer.getPlayerState();
    if(st===1){ytPlayer.pauseVideo();S.playing=false;}else{ytPlayer.playVideo();S.playing=true;}
    updatePlayIcon();renderPlayer();
  }else{
    if(audio.paused)audio.play().then(()=>{S.playing=true;updatePlayIcon();renderPlayer();}).catch(()=>toast('Lecture impossible'));
    else{audio.pause();S.playing=false;updatePlayIcon();renderPlayer();}
  }
  if(S.playing)$('#fp').classList.add('playing');else $('#fp').classList.remove('playing');
}

function next(auto=false){
  if(!S.tracks.length)return;
  if(S.repeat===2&&auto){const t=S.tracks[S.cur];if(t.type==='yt'&&ytPlayer){ytPlayer.seekTo(0);ytPlayer.playVideo();}else{audio.currentTime=0;audio.play();}return;}
  if(S.queue&&S.queue.length&&!S.shuffle){
    const curId=S.tracks[S.cur]?.id;
    const pos=S.queue.indexOf(curId);
    if(pos>=0){
      let nPos=pos+1;
      if(nPos>=S.queue.length){if(S.repeat===1||!auto)nPos=0;else{S.playing=false;updatePlayIcon();renderPlayer();return;}}
      const nextTrack=S.tracks.find(t=>t.id===S.queue[nPos]);
      if(nextTrack){play(S.tracks.indexOf(nextTrack));return;}
    }
  }
  let n;
  if(S.shuffle&&S.tracks.length>1){do{n=Math.floor(Math.random()*S.tracks.length);}while(n===S.cur);}
  else{n=S.cur+1;if(n>=S.tracks.length){if(S.repeat===1||!auto)n=0;else{S.playing=false;updatePlayIcon();renderPlayer();return;}}}
  play(n);
}
function prev(){
  if(!S.tracks.length)return;
  const t=S.tracks[S.cur];
  if(t){const ct=t.type==='yt'?(ytPlayer?.getCurrentTime?.()||0):audio.currentTime;if(ct>3){if(t.type==='yt'&&ytPlayer)ytPlayer.seekTo(0);else audio.currentTime=0;return;}}
  let n=S.cur-1;if(n<0)n=S.tracks.length-1;play(n);
}

async function deleteTrack(idx){
  const t=S.tracks[idx];if(!t)return;
  S.tracks.splice(idx,1);
  S.liked=S.liked.filter(id=>id!==t.id);
  S.playlists.forEach(p=>{p.trackIds=p.trackIds.filter(id=>id!==t.id);});
  if(S.queue)S.queue=S.queue.filter(id=>id!==t.id);
  if(t.type==='file'){try{await DB.del('files',t.id);}catch(e){}if(t.src)URL.revokeObjectURL(t.src);}
  if(S.cur===idx){
    audio.pause();audio.removeAttribute('src');audio.load();
    if(ytPlayer&&ytPlayer.stopVideo)try{ytPlayer.stopVideo();}catch(e){}
    stopPoll();stopAdPoll();
    S.cur=-1;S.playing=false;
    closeFullscreen();
    updatePlayIcon();
  }else if(S.cur>idx)S.cur--;
  save();renderCurrentView();toast('Titre supprimé');
}

/* ===== Audio events ===== */
audio.addEventListener('timeupdate',()=>{
  const d=audio.duration||0,c=audio.currentTime||0;
  const pct=d?(c/d)*100:0;

  $('#fpProgressFill').style.width=pct+'%';
  $('#cur').textContent=fmt(c);$('#dur').textContent=fmt(d);
  $('#fpCur').textContent=fmt(c);$('#fpDur').textContent=fmt(d);
});
audio.addEventListener('loadedmetadata',()=>{
  const t=S.tracks[S.cur];
  if(t&&t.type==='file'&&!t.duration&&isFinite(audio.duration)){t.duration=audio.duration;save();}
});
audio.addEventListener('ended',()=>next(true));
audio.addEventListener('play',()=>{S.playing=true;updatePlayIcon();if(S.fullscreenOpen)$('#fp').classList.add('playing');});
audio.addEventListener('pause',()=>{if(S.cur>=0&&S.tracks[S.cur]?.type==='file'){S.playing=false;updatePlayIcon();$('#fp').classList.remove('playing');}});

function startPoll(){stopPoll();ytPollTimer=setInterval(()=>{
  if(!ytPlayer||!ytPlayer.getCurrentTime)return;
  if(S.adPlaying)return;
  const c=ytPlayer.getCurrentTime()||0,d=ytPlayer.getDuration()||0;
  const pct=d?(c/d)*100:0;
  $('#progressFill').style.width=pct+'%';
  $('#fpProgressFill').style.width=pct+'%';
  $('#cur').textContent=fmt(c);$('#dur').textContent=fmt(d);
  $('#fpCur').textContent=fmt(c);$('#fpDur').textContent=fmt(d);
  const t=S.tracks[S.cur];
  if(t&&d&&!t.duration){t.duration=d;save();}
},250);}
function stopPoll(){if(ytPollTimer){clearInterval(ytPollTimer);ytPollTimer=null;}}

/* ===== Progress/Volume ===== */
function bindProgress(el,fillEl){
  let drag=false;
  function seekAt(x){
    const r=el.getBoundingClientRect();const p=Math.max(0,Math.min(1,(x-r.left)/r.width));
    fillEl.style.width=(p*100)+'%';
    const t=S.tracks[S.cur];if(!t)return;
    if(t.type==='yt'){if(ytPlayer&&ytPlayer.getDuration){const d=ytPlayer.getDuration();if(d)ytPlayer.seekTo(p*d,true);}}
    else{if(audio.duration)audio.currentTime=p*audio.duration;}
  }
  el.addEventListener('pointerdown',e=>{drag=true;el.setPointerCapture(e.pointerId);seekAt(e.clientX);});
  el.addEventListener('pointermove',e=>{if(drag)seekAt(e.clientX);});
  el.addEventListener('pointerup',()=>drag=false);
  el.addEventListener('pointercancel',()=>drag=false);
}
bindProgress($('#progress'),$('#progressFill'));
bindProgress($('#fpProgress'),$('#fpProgressFill'));

function bindVolume(el,fillEl){
  let drag=false;
  function at(x){
    const r=el.getBoundingClientRect();const p=Math.max(0,Math.min(1,(x-r.left)/r.width));
    S.vol=p;audio.volume=p;
    if(ytPlayer&&ytPlayer.setVolume)try{ytPlayer.setVolume(p*100);}catch(e){}
    fillEl.style.width=(p*100)+'%';
    try{localStorage.setItem('2am:vol',p);}catch(e){}
  }
  el.addEventListener('pointerdown',e=>{drag=true;el.setPointerCapture(e.pointerId);at(e.clientX);});
  el.addEventListener('pointermove',e=>{if(drag)at(e.clientX);});
  el.addEventListener('pointerup',()=>drag=false);
  el.addEventListener('pointercancel',()=>drag=false);
}
bindVolume($('#volume'),$('#volumeFill'));
bindVolume($('#fpVolume'),$('#fpVolumeFill'));

  const tracks=isLikedView?S.tracks.filter(t=>S.liked.includes(t.id)):p.trackIds.map(id=>S.tracks.find(t=>t.id===id)).filter(Boolean);
  const name=isLikedView?'Titres aimés':p.name;
  const cover=isLikedView?null:(tracks[0]?.thumb||null);
  const el=$('#viewPlaylist');
  const art=isLikedView
    ? '<svg style="width:60px;height:60px;fill:#fff" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>'
    : (cover?`<img src="${esc(cover)}" alt="">`:'<span>♪</span>');
  el.innerHTML=`
    <button class="icon-btn" id="backBtn" style="margin-bottom:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="pl-head">
      <div class="pl-cover" ${isLikedView?'style="background:linear-gradient(135deg,#5B4BFF,#8B7BFF)"':''}>${art}</div>
      <div class="pl-info">
        <div class="kind">${isLikedView?'Collection':'Playlist'}</div>
        <h2>${esc(name)}</h2>
        <div class="meta">${tracks.length} titre${tracks.length>1?'s':''}</div>
      </div>
    </div>
    <div class="pl-actions">
      <button class="pl-play" id="plPlay" ${tracks.length?'':'disabled'}>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Lecture
      </button>
      ${!isLikedView?`<button class="pl-mini" id="plEditBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Modifier</button>`:''}
    </div>
    ${tracks.length?tracks.map(t=>trackRowHTML(t,{fromPlaylist:isLikedView?null:p.id,draggable:!isLikedView})).join(''):'<div class="empty"><div class="empty-title">Playlist vide</div></div>'}
  `;
  $('#backBtn').onclick=()=>setView('library');
  const plPlay=$('#plPlay');
  if(plPlay)plPlay.onclick=()=>{if(!tracks.length)return;const ids=tracks.map(t=>t.id);play(S.tracks.indexOf(tracks[0]),ids);};
  const plEditBtn=$('#plEditBtn');
  if(plEditBtn)plEditBtn.onclick=()=>openEditPlaylist(p.id);
  el.querySelectorAll('.track').forEach(row=>{
    row.addEventListener('click',e=>{
      const like=e.target.closest('[data-like]');
      if(like){e.stopPropagation();toggleLikeByIdx(+like.dataset.like);return;}
      const edit=e.target.closest('[data-edit]');
      if(edit){e.stopPropagation();openEditTrack(+edit.dataset.edit);return;}
      const rm=e.target.closest('[data-removefrom]');
      if(rm){e.stopPropagation();const pid=rm.dataset.removefrom;const tid=rm.dataset.trackid;const pl=S.playlists.find(x=>x.id===pid);if(pl){pl.trackIds=pl.trackIds.filter(id=>id!==tid);save();renderPlaylistView();toast('Retiré de la playlist');}return;}
      const del=e.target.closest('[data-del]');
      if(del){e.stopPropagation();deleteTrack(+del.dataset.del);return;}
      const idx=+row.dataset.idx;
      if(idx===S.cur)toggle();else play(idx,ids);
    });
  });
  if(!isLikedView&&tracks.length)enableDragReorder(el,p);
}
function enableDragReorder(container,p){
  let dragIdx=null;
  container.querySelectorAll('.track[draggable]').forEach(row=>{
    row.addEventListener('dragstart',e=>{dragIdx=+row.dataset.idx;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');container.querySelectorAll('.track').forEach(r=>r.classList.remove('drag-over'));});
    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault();
      const targetIdx=+row.dataset.idx;
      if(dragIdx===null||dragIdx===targetIdx)return;
      const draggedTrack=S.tracks[dragIdx],targetTrack=S.tracks[targetIdx];
      const fromP=p.trackIds.indexOf(draggedTrack.id),toP=p.trackIds.indexOf(targetTrack.id);
      if(fromP<0||toP<0)return;
      p.trackIds.splice(fromP,1);p.trackIds.splice(toP,0,draggedTrack.id);
      save();renderPlaylistView();toast('Ordre mis à jour');
    });
  });
}

/* ===== Player render ===== */
function renderPlayer(){
  const t=S.tracks[S.cur];
  if(S.adPlaying)return;
  if(!t){
    $('#pTitle').textContent='—';$('#pArtist').textContent='—';$('#pArt').innerHTML='2';
    document.title='2AM';
    return;
  }
  $('#pTitle').textContent=t.title;$('#pArtist').textContent=t.artist;
  const art=t.thumb?`<img src="${esc(t.thumb)}" alt="">`:`<span>${esc((t.title[0]||'?').toUpperCase())}</span>`;
  $('#pArt').innerHTML=art;
  document.title='2AM — '+t.title;
  updateBottomPlayerVisibility();
}
function renderFullscreen(){
  const t=S.tracks[S.cur];
  if(S.adPlaying)return;
  if(!t){
    $('#fpTitle').textContent='Aucun titre';$('#fpArtist').textContent='—';
    $('#fpArt').innerHTML='<span>2</span>';
    return;
  }
  $('#fpTitle').textContent=t.title;
  $('#fpArtist').textContent=t.artist;
  $('#fpArt').innerHTML=t.thumb?`<img src="${esc(t.thumb)}" alt="">`:`<span>${esc((t.title[0]||'?').toUpperCase())}</span>`;
  updateLikeUI();
}
// call renderFullscreen from renderCurrentView too
const _rcv=renderCurrentView;
renderCurrentView=function(){_rcv();renderFullscreen();};

/* ===== Like helper ===== */
function toggleLikeByIdx(idx){
  const t=S.tracks[idx];if(!t)return;
  if(isLiked(t.id)){S.liked=S.liked.filter(id=>id!==t.id);toast('Retiré des titres aimés');}
  else{S.liked.push(t.id);toast('Ajouté aux titres aimés');}
  save();updateLikeUI();renderCurrentView();
}

/* ===== Content clicks ===== */
$('#content').addEventListener('click',e=>{
  const trendPlay=e.target.closest('[data-trendplay]');
  if(trendPlay){e.stopPropagation();playTrending(+trendPlay.dataset.trendplay);return;}
  const trendCard=e.target.closest('[data-trend]');
  if(trendCard){addTrending(+trendCard.dataset.trend);return;}
  const likedEntry=e.target.closest('[data-liked]');
  if(likedEntry){setView('playlist','liked');return;}
  const plCard=e.target.closest('[data-plid]');
  if(plCard){setView('playlist',plCard.dataset.plid);return;}
  const row=e.target.closest('.track');
  if(row){
    const like=e.target.closest('[data-like]');
    if(like){e.stopPropagation();toggleLikeByIdx(+like.dataset.like);return;}
    const edit=e.target.closest('[data-edit]');
    if(edit){e.stopPropagation();openEditTrack(+edit.dataset.edit);return;}
    const del=e.target.closest('[data-del]');
    if(del){e.stopPropagation();deleteTrack(+del.dataset.del);return;}
    const idx=+row.dataset.idx;
    if(idx===S.cur)toggle();else play(idx);
  }
});

/* ===== Trending actions ===== */
function findExisting(ytId){return S.tracks.find(t=>t.ytId===ytId);}
async function playTrending(i){
  const item=S.trending[i];if(!item)return;
  let existing=findExisting(item.ytId);
  if(!existing){
    existing={id:uid(),title:item.title,artist:item.channel,type:'yt',ytId:item.ytId,thumb:item.thumb,duration:0,src:'https://www.youtube.com/watch?v='+item.ytId};
    S.tracks.push(existing);save();
  }
  play(S.tracks.indexOf(existing));
}
async function addTrending(i){
  const item=S.trending[i];if(!item)return;
  let existing=findExisting(item.ytId);
  if(existing){toast('Déjà dans la bibliothèque');return;}
  const track={id:uid(),title:item.title,artist:item.channel,type:'yt',ytId:item.ytId,thumb:item.thumb,duration:0,src:'https://www.youtube.com/watch?v='+item.ytId};
  S.tracks.push(track);save();
  toast('Ajouté à la bibliothèque');
  S.pendingTrack=track;openPlaylistPicker('Ajouter à une playlist…');
}

/* ===== Search bar (bibliothèque uniquement) ===== */
$('#openSearch').onclick=()=>{
  const w=$('#searchWrap');
  w.classList.toggle('show');
  if(w.classList.contains('show')){setTimeout(()=>$('#searchInput').focus(),100);if(S.view!=='library')setView('library');}
  else{S.filter='';$('#searchInput').value='';renderLibrary();}
};
$('#searchInput').addEventListener('input',e=>{
  S.filter=e.target.value;
  if(S.view!=='library')setView('library');
  renderLibrary();
});

/* ===== Import modal ===== */
const importModal=$('#importModal');
const openImport=()=>importModal.classList.add('open');
const closeImport=()=>importModal.classList.remove('open');
$('#openImport').onclick=openImport;
$('#closeImport').onclick=closeImport;
importModal.addEventListener('click',e=>{if(e.target===importModal)closeImport();});
const fileInput=$('#fileInput');
$('#dropZone').onclick=()=>fileInput.click();
fileInput.onchange=e=>{if(e.target.files.length)importFiles(e.target.files);e.target.value='';};
const dz=$('#dropZone');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.add('over');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('over');}));
dz.addEventListener('drop',e=>{if(e.dataTransfer.files.length)importFiles(e.dataTransfer.files);});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{if(e.dataTransfer.files.length&&!importModal.classList.contains('open')){e.preventDefault();importFiles(e.dataTransfer.files);}});

/* ===== Online search modal ===== */
const searchModal=$('#searchModal');
$('#closeSearchModal').onclick=()=>searchModal.classList.remove('open');
searchModal.addEventListener('click',e=>{if(e.target===searchModal)searchModal.classList.remove('open');});
let searchTimer=null;
$('#ytInput').addEventListener('input',e=>{clearTimeout(searchTimer);const q=e.target.value.trim();searchTimer=setTimeout(()=>runSearch(q),400);});
async function runSearch(q){
  const el=$('#ytResults');
  if(!q){el.innerHTML='';return;}
  el.innerHTML='<div class="search-msg">Recherche…</div>';
  try{
    const results=await searchOnline(q);
    if(!results.length){el.innerHTML='<div class="search-msg">Aucun résultat</div>';return;}
    el.innerHTML=results.map(r=>`<div class="search-result" data-ytid="${esc(r.ytId)}" data-title="${esc(r.title)}" data-channel="${esc(r.channel)}" data-thumb="${esc(r.thumb)}">
      <div class="search-result-art"><img src="${esc(r.thumb)}" alt="" loading="lazy"></div>
      <div class="search-result-info"><div class="search-result-title">${esc(r.title)}</div><div class="search-result-channel">${esc(r.channel)}</div></div>
      <button class="search-result-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>`).join('');
  }catch(err){
    el.innerHTML=`<div class="search-msg"><div style="color:#ff6b6b;margin-bottom:8px;font-weight:600">Erreur</div><div>${esc(err.message)}</div></div>`;
  }
}
$('#ytResults').addEventListener('click',e=>{
  const row=e.target.closest('.search-result');if(!row)return;
  addOnlineResult({ytId:row.dataset.ytid,title:row.dataset.title,channel:row.dataset.channel,thumb:row.dataset.thumb});
});
function addOnlineResult(item){
  if(S.tracks.some(t=>t.ytId===item.ytId)){toast('Déjà dans la bibliothèque');return;}
  const track={id:uid(),title:item.title,artist:item.channel,type:'yt',ytId:item.ytId,thumb:item.thumb,duration:0,src:'https://www.youtube.com/watch?v='+item.ytId};
  S.tracks.push(track);save();
  toast('Ajouté à la bibliothèque');
  S.pendingTrack=track;openPlaylistPicker('Ajouter à une playlist…');
}
$('#goOnlineSearch').onclick=()=>{closeImport();searchModal.classList.add('open');setTimeout(()=>$('#ytInput').focus(),250);};

/* ===== Playlist picker ===== */
const picker=$('#playlistPicker');
function openPlaylistPicker(title){
  $('#pickerTitle').textContent=title||'Ajouter à…';
  const list=$('#pickerList');
  list.innerHTML=S.playlists.length?S.playlists.map(p=>`<div class="picker-item" data-plid="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>${esc(p.name)}</span></div>`).join(''):'<div style="padding:14px;text-align:center;color:rgba(255,255,255,.4);font-size:13px">Aucune playlist</div>';
  picker.classList.add('open');setTimeout(()=>$('#newPlName').focus(),200);
}
$('#pickerList').addEventListener('click',e=>{
  const item=e.target.closest('[data-plid]');if(!item)return;
  if(S.pendingTrack){
    const p=S.playlists.find(x=>x.id===item.dataset.plid);
    if(p&&!p.trackIds.includes(S.pendingTrack.id)){p.trackIds.push(S.pendingTrack.id);save();renderCurrentView();toast('Ajouté à '+p.name);}
  }
  picker.classList.remove('open');S.pendingTrack=null;
});
$('#newPlName').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.value.trim()){
    const p={id:uid(),name:e.target.value.trim(),trackIds:[]};
    S.playlists.push(p);
    if(S.pendingTrack)p.trackIds.push(S.pendingTrack.id);
    e.target.value='';save();renderCurrentView();
    picker.classList.remove('open');
    toast('Playlist créée'+(S.pendingTrack?' + titre ajouté':''));
    S.pendingTrack=null;
  }
});
picker.addEventListener('click',e=>{if(e.target===picker){picker.classList.remove('open');S.pendingTrack=null;}});

/* ===== Edit Track ===== */
const editTrackModal=$('#editTrackModal');
function openEditTrack(idx){
  const t=S.tracks[idx];if(!t)return;
  S.editingTrackId=t.id;
  $('#etTitle').value=t.title;$('#etArtist').value=t.artist;
  editTrackModal.classList.add('open');
  setTimeout(()=>$('#etTitle').focus(),250);
}
function closeEditTrack(){editTrackModal.classList.remove('open');S.editingTrackId=null;}
$('#closeEditTrack').onclick=closeEditTrack;
editTrackModal.addEventListener('click',e=>{if(e.target===editTrackModal)closeEditTrack();});
$('#etCancel').onclick=closeEditTrack;
$('#etSave').onclick=()=>{
  const id=S.editingTrackId;if(!id)return;
  const t=S.tracks.find(x=>x.id===id);if(!t)return;
  t.title=$('#etTitle').value.trim()||t.title;
  t.artist=$('#etArtist').value.trim()||t.artist;
  save();renderCurrentView();updateMediaSession(t);
  toast('Titre modifié');closeEditTrack();
};

/* ===== Edit Playlist ===== */
const editPlModal=$('#editPlModal');
function openEditPlaylist(plId){
  const p=S.playlists.find(x=>x.id===plId);if(!p)return;
  S.editingPlId=plId;
  $('#epName').value=p.name;
  editPlModal.classList.add('open');
  setTimeout(()=>$('#epName').focus(),250);
}
function closeEditPl(){editPlModal.classList.remove('open');S.editingPlId=null;}
$('#closeEditPl').onclick=closeEditPl;
editPlModal.addEventListener('click',e=>{if(e.target===editPlModal)closeEditPl();});
$('#epCancel').onclick=closeEditPl;
$('#epSave').onclick=()=>{
  const p=S.playlists.find(x=>x.id===S.editingPlId);if(!p)return;
  p.name=$('#epName').value.trim()||p.name;
  save();renderCurrentView();
  toast('Playlist modifiée');closeEditPl();
};
$('#epDelete').onclick=()=>{
  const p=S.playlists.find(x=>x.id===S.editingPlId);if(!p)return;
  if(!confirm('Supprimer la playlist "'+p.name+'" ?'))return;
  S.playlists=S.playlists.filter(x=>x.id!==p.id);
  save();closeEditPl();setView('library');
  toast('Playlist supprimée');
};

/* ===== Toast ===== */
let toastTimer;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}

/* ===== Init ===== */
(async function init(){
  updatePlayIcon();
  const v=parseFloat(localStorage.getItem('2am:vol'));
  if(!isNaN(v)){S.vol=v;audio.volume=v;}
  $('#volumeFill').style.width=(S.vol*100)+'%';
  $('#fpVolumeFill').style.width=(S.vol*100)+'%';
  loadYTAPI();
  await restore();
  setView('home');
  renderCurrentView();
})();

})();
</script>
</body>
</html>
